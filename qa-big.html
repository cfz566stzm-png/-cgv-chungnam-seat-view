<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 크게 보기 QA</title>
<style>
  html,body{margin:0;padding:0;background:#C9CFD6;font:600 12px -apple-system,system-ui,sans-serif}
  .tag{position:fixed;right:8px;top:8px;background:#111;color:#fff;padding:5px 9px;border-radius:6px;z-index:9}
  .phone{border:8px solid #111;border-radius:26px;overflow:hidden;background:#000;margin:16px}
  iframe{border:0;display:block;background:#000}
</style>
</head>
<body>
<div class="tag" id="tag"></div>
<div class="phone"><iframe id="f"></iframe></div>
<script>
  var q = new URLSearchParams(location.search);
  var w = +(q.get('w') || 844), h = +(q.get('h') || 390);
  var f = document.getElementById('f');
  f.style.width = w + 'px'; f.style.height = h + 'px';
  var path = q.get('p') || '#/t/cheonan-pentaport/h/cheonan-pentaport-n9/s/F11';
  document.getElementById('tag').textContent = w + '×' + h + ' · ' + path;

  /* 콘솔 오류 수집 — iframe 창이 생기는 즉시 리스너를 붙인다(파싱·실행보다 앞서도록 폴링) */
  window.__errs = [];
  var hooked = false;
  var iv = setInterval(function () {
    if (hooked) { clearInterval(iv); return; }
    try {
      var cw = f.contentWindow;
      if (!cw || !cw.document || cw === window) return;
      if (cw.__qaHooked) return;
      cw.__qaHooked = true; hooked = true; clearInterval(iv);
      cw.addEventListener('error', function (e) {
        window.__errs.push('error: ' + (e.message || '') + ' @ ' + (e.filename || '').split('/').pop() + ':' + (e.lineno || 0));
      }, true);
      cw.addEventListener('unhandledrejection', function (e) {
        window.__errs.push('rejection: ' + ((e.reason && (e.reason.message || e.reason)) || ''));
      });
    } catch (e) {}
  }, 8);

  f.src = './index.html' + path;

  window.__qa = {
    errs: function () { return window.__errs.slice(); },
    rects: function () {
      var d = f.contentDocument;
      var out = {};
      ['.big-x', '.big-tag', '.bigmodal .v3d-vid', '.bigmodal .v3d-mute', '.bigmodal .v3d-fov', '.bigmodal .v3d-hudbtns'].forEach(function (sel) {
        var el = d.querySelector(sel);
        if (!el) { out[sel] = null; return; }
        var r = el.getBoundingClientRect();
        var cs = f.contentWindow.getComputedStyle(el);
        out[sel] = { x: +r.x.toFixed(1), y: +r.y.toFixed(1), w: +r.width.toFixed(1), h: +r.height.toFixed(1),
                     vis: cs.display !== 'none' && r.width > 0 };
      });
      return out;
    }
  };
</script>
</body>
</html>

  /* 탭·검색·필터를 한 장의 도구 카드로 묶고, 중복 동선(내 좌석 기록)은 하단 탭바에 맡긴다 */
  .hometools{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 12px 11px;box-shadow:0 1px 2px rgba(25,31,40,.03)}
  .hometools .tabsrow{display:block}
  .hometools .homebtns{display:none}
  .hometools .rtabs{background:#F2F4F6;padding:3px;border-radius:12px;margin:0}
  .hometools .rtab{height:38px;border-radius:9px;font-size:12.5px}
  .hometools .searchrow{margin-top:9px}
  .hometools .qinput{height:44px;border-color:var(--line)}
  .hometools #filterRow.wrap{padding:0;max-width:none;margin:10px 0 0;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;row-gap:0}
  .hometools #filterRow.wrap::-webkit-scrollbar{display:none;height:0}
  .hometools #filterRow .chip{flex:0 0 auto;height:32px;min-height:32px;font-size:12px;padding:0 11px}

  .section-title{margin:16px 2px 9px}
  .section-title h2{font-size:17px;letter-spacing:-.035em}
  .section-title .cap{font-size:11.5px}

  /* 카드: 주소는 한 줄로 잘라 카드 높이를 고르게 → 한 화면에 더 많이 */
  .tgrid{gap:10px;margin-top:12px}
  .tcard{padding:14px;border-radius:18px}
  .tcard-top{gap:10px}
  .tlogo{width:38px;height:38px;border-radius:11px;font-size:13px}
  .tname{font-size:15.5px;letter-spacing:-.035em}
  .tcard .tregion{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .tbadges{margin-top:9px;gap:4px}
  .tcard .tbadges .badge{height:22px;padding:0 8px;font-size:11px;border-radius:7px}
  .tmeta{margin-top:10px;padding-top:10px;gap:12px}
  .tmeta div{font-size:11.5px}
  .tmeta b{font-size:15px}
  .dstat{margin-top:16px}
}

/* ================= 2026-11-18 · 18대 개선 (STATE24) ================= */
/* 홈 첫 방문 안내 */
.guide{margin-top:14px}
.guide-head{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:0;text-align:left;cursor:pointer}
.guide-ic{width:34px;height:34px;flex:0 0 auto;border-radius:11px;background:var(--green-l);display:flex;align-items:center;justify-content:center;font-size:17px}
.guide-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.guide-tx b{font-size:14px;font-weight:850;color:var(--ink);letter-spacing:-.01em}
.guide-tx i{font-style:normal;font-size:11.5px;font-weight:700;color:var(--mute)}
.guide-chev{flex:0 0 auto;font-size:11.5px;font-weight:800;color:var(--green-d);border:1px solid var(--green-soft);background:var(--green-l);border-radius:999px;padding:5px 9px}
.guide-body{display:none}
.guide.open .guide-body{display:block}
.guide-body ol{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px;counter-reset:g}
.guide-body li{position:relative;padding-left:27px;font-size:12.5px;line-height:1.6;color:#3D4A44;word-break:keep-all}
.guide-body li b{display:block;font-weight:850;color:var(--ink);font-size:13px;margin-bottom:1px}
.guide-body li:before{counter-increment:g;content:counter(g);position:absolute;left:0;top:1px;width:19px;height:19px;border-radius:50%;background:var(--green);color:#fff;font-size:11px;font-weight:850;display:flex;align-items:center;justify-content:center}
.guide-foot{margin-top:12px;padding-top:10px;border-top:1px solid var(--line-2);font-size:11.5px;line-height:1.55;color:var(--mute);font-weight:700;word-break:keep-all}

/* 버그 제보 (푸터 버튼 + 모달) */
.reportrow{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2)}
.reportbtn{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:800;color:var(--ink);cursor:pointer}
.reportbtn:active{background:#F4F7F5}
.reportmail{font-size:11.5px;color:var(--mute);font-weight:700}
.linkbtn{border:0;background:none;padding:0;color:var(--green-d);font-weight:800;font-size:11.5px;cursor:pointer;text-decoration:underline}
.reportmodal{position:fixed;inset:0;z-index:970;background:rgba(8,12,10,.56);display:flex;align-items:center;justify-content:center;padding:14px}
.report-inner{width:min(540px,100%);max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch;background:#fff;border-radius:20px;padding:18px 18px 16px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.report-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.report-top b{display:block;font-size:16px;font-weight:850;color:var(--ink);letter-spacing:-.02em}
.report-top span{display:block;margin-top:4px;font-size:11.5px;line-height:1.5;color:var(--mute);font-weight:700;word-break:keep-all}
.report-x{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:14px;color:var(--sub);cursor:pointer}
.rf{display:block;margin-bottom:11px}
.rf>span{display:block;font-size:12px;font-weight:850;color:var(--sub);margin-bottom:5px}
.rf>span i{font-style:normal;font-weight:700;color:var(--mute);font-size:11px}
.rf select,.rf input,.rf textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:#FBFCFC;padding:10px 12px;font-size:16px;font-weight:700;color:var(--ink);font-family:inherit}
.rf select{height:42px;padding:0 12px}
.rf textarea{resize:vertical;min-height:104px;line-height:1.55}
.report-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.report-send{height:42px;padding:0 18px;border-radius:12px;border:0;background:var(--green);color:#fff;font-size:13.5px;font-weight:850;cursor:pointer}
.report-send:disabled{opacity:.6}
.report-alt{height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--sub);font-size:12.5px;font-weight:800;cursor:pointer}
.report-status{margin-top:10px;font-size:12px;font-weight:750;line-height:1.55;min-height:16px;color:var(--mute);word-break:keep-all}
.report-status.ok{color:var(--green-d)}
.report-status.err{color:#B42318}
.report-disc{margin-top:10px;font-size:11px;line-height:1.55;color:#98A2AE;font-weight:700;word-break:keep-all}
body .reportmodal .rf input:focus,body .reportmodal .rf textarea:focus,body .reportmodal .rf select:focus{outline:2px solid var(--green-soft);border-color:var(--green)}

/* 상영관 구조 안내(ULTRA 4DX · 단상/상단 스크린 · 리뉴얼 전 제원) */
.structnote{margin:10px 0 2px;display:flex;flex-direction:column;gap:6px;background:#F5F9FF;border-color:#DDE8F5}
.structnote b{color:#1B4B8A}
.imax-scale{display:block;margin-top:5px;font-size:11.5px;color:#6B7684;font-weight:700}

@media (max-width:959px){
  .guide{margin-top:12px}
  .reportmodal{align-items:flex-end;padding:0}
  .report-inner{border-radius:20px 20px 0 0;max-height:94dvh;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  .report-actions .report-send,.report-actions .report-alt{flex:1 1 auto}
  .rf select,.rf input,.rf textarea{font-size:16px}
}

/* ===== 2026-11-19 · PRIVATE BOX 구조·좌석 평점·내 키 눈높이·제보 폼·데스크톱 패널 ===== */

/* --- 내 키·앉은 눈높이 --- */
.eyectl{margin:12px 0 6px;padding:12px 13px;border:1px solid var(--line-2);border-radius:14px;background:#F7FAF8}
.eyectl-hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin-bottom:9px}
.eyectl-hd b{font-size:13px;font-weight:850;letter-spacing:-.02em}
.eyectl-hd span{font-size:11.5px;font-weight:700;color:var(--mute)}
.eyectl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.eyectl-lb{font-size:12px;font-weight:800;color:var(--ink-2)}
.eyectl-step{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:17px;font-weight:800;color:var(--ink);cursor:pointer;line-height:1}
.eyectl-step:active{background:#EBF1EE}
.eyectl-h{font-size:15px;font-weight:850;min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
.eyectl-eye{font-size:12px;font-weight:700;color:var(--sub)}
.eyectl-eye b{color:var(--green-d)}
.eyectl-row2{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.eyectl-row2 label{font-size:11.5px;font-weight:800;color:var(--mute)}
.eyectl-row2 input{width:74px;height:34px;border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:13px;font-weight:700;background:#fff}
.eyectl-cm{font-size:11.5px;font-weight:700;color:var(--mute)}
.eyectl-save,.eyectl-reset{height:34px;padding:0 12px;border-radius:10px;font-size:12.5px;font-weight:800;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.eyectl-save{background:var(--green);border-color:var(--green);color:#fff}
.eyectl-note{margin-top:8px;font-size:11.5px;line-height:1.6;color:var(--mute);font-weight:600}

/* --- 자세한 수치 접기 --- */
.ana-detail{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.ana-detail summary{font-size:12px;font-weight:800;color:var(--sub);cursor:pointer;list-style:none}
.ana-detail summary::-webkit-details-marker{display:none}
.ana-detail summary::before{content:'▸ ';color:var(--mute)}
.ana-detail[open] summary::before{content:'▾ '}
.ana-rows.tight{margin-top:6px}

/* --- 별점 --- */
.starpick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.starpick-lb{font-size:12.5px;font-weight:800;color:var(--ink-2)}
.starpick-btns{display:flex;gap:2px}
.starpick-btns button{width:34px;height:34px;border:0;background:none;font-size:23px;line-height:1;color:#DCE2E7;cursor:pointer;padding:0;transition:transform .08s}
.starpick-btns button:active{transform:scale(.9)}
.starpick-btns button[aria-pressed="true"]{color:#FFB020}
.starpick-tx{font-size:12px;font-weight:700;color:var(--sub)}
.starline{font-size:12px;color:#FFB020;letter-spacing:.5px}
.starline i{font-style:normal;color:#E3E8EC}
.avgstar{display:inline-flex;align-items:center;gap:3px;margin-left:4px;font-size:11.5px;font-weight:800;color:var(--sub)}
.avgstar b{color:#B8790B}

/* --- 제보 폼 (iTool 스타일) --- */
.report-lead{margin:2px 0 14px;font-size:13px;line-height:1.65;font-weight:600;color:var(--ink-2)}
.report-fld{margin-bottom:14px}
.report-fld textarea{width:100%;min-height:122px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:13.5px;line-height:1.6;resize:vertical;background:#fff;color:var(--ink)}
.rf-lab{display:block;font-size:12px;font-weight:800;color:var(--mute);margin-bottom:6px}
.report-fld input[type=email]{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:13.5px;font-weight:600;background:#fff;color:var(--ink)}
.rf-file{position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer}
.rf-file input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.rf-file-btn{display:inline-flex;align-items:center;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:12.5px;font-weight:800;color:var(--ink)}
.rf-file-name{font-size:12px;font-weight:700;color:var(--mute);overflow:hidden;text-overflow:ellipsis;max-width:58%;white-space:nowrap}
.report-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.report-send{border:0;border-radius:12px;background:#111;color:#fff;font-size:14px;font-weight:850;padding:0 22px;height:46px;cursor:pointer}

/* --- 데스크톱(노트북) 2단: 위 막대에 가리지도, 아래가 잘리지도 않게 ---
   예전엔 패널이 top:16px 에 max-height:100vh-28px 라서 ① 창 아래로 12px 넘치고
   ② 위쪽이 붙어 있는 막대(topbar+ctxbar)에 가렸다. 두 막대 높이를 재서 --panelTop/--panelMax 로 쓴다. */
@media (min-width:960px){
  body.view-hall .hallsplit{align-items:start}
  body.view-hall .hallsplit .panel{
    top:var(--panelTop, 16px);
    max-height:var(--panelMax, calc(100vh - 28px));
    padding-bottom:72px;
    scroll-padding-bottom:24px;
    scrollbar-gutter:stable;
  }
  body.view-hall .hallsplit .panel .card{padding-bottom:8px}
}

/* =======================================================================
   2026-11-19 — 좌석 평점 0.5점 단위(반 별) + 시야 분석 표 정리
   ======================================================================= */

/* --- 별점: 회색 별 위에 금색 별을 채움 폭만큼 덮어 0.5개도 보이게 --- */
.starpick{padding:11px 12px}
.starpick-btns button{padding:0;background:none;border:0;line-height:0}
.sp-wrap{position:relative;display:block;width:34px;height:34px}
.sp-wrap .sp-bg,.sp-wrap .sp-fg b{position:absolute;inset:0;display:grid;place-items:center;font-size:23px;line-height:1}
.sp-wrap .sp-bg{color:#DCE2E7}
.sp-wrap .sp-fg{position:absolute;left:0;top:0;height:100%;overflow:hidden}
.sp-wrap .sp-fg b{position:absolute;left:0;top:0;width:34px;height:100%;font-weight:400;color:#FFB020}
.starpick-tx{font-variant-numeric:tabular-nums}
.starline .sl{position:relative;display:inline-block;font-style:normal}
.starline .sl s{text-decoration:none;color:#E3E8EC}
.starline .sl b{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:#FFB020;font-weight:400}

/* --- 시야 분석 표: 라벨·값·배지 3열 고정, 행간·여백을 고르게 --- */
.ana{border-radius:18px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.ana-head{padding:14px 15px 10px;border-bottom:1px solid var(--line-2)}
.ana-head h4{font-size:15.5px;font-weight:900;letter-spacing:-.02em}
.ana-head span{font-size:11.5px;font-weight:750;color:var(--mute);letter-spacing:-.01em}
.ana-rows{padding:6px 6px 8px}
.ana-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:10px;
  padding:10px 9px;border-radius:11px;min-height:46px}
.ana-row:nth-child(odd){background:#FAFBFC}
.ana-row>span:first-child{min-width:0;font-size:13px;font-weight:750;color:#4E5968;line-height:1.38;
  letter-spacing:-.01em;white-space:nowrap}
.ana-v{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:flex-end;gap:2px 6px;
  text-align:right;min-width:0}
.ana-row b{font-size:14.5px;font-weight:850;color:#111827;line-height:1.3;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;white-space:nowrap}
.ana-row .anax{font-size:11.5px;font-weight:700;color:var(--mute);line-height:1.4;white-space:normal;word-break:keep-all}
.ana-row>.cfb{justify-self:end;align-self:center;min-width:58px;justify-content:center;font-size:11px;padding:4px 7px}
.ana-rows.tight{padding:4px 6px 8px}
.ana-rows.tight .ana-row{padding:8px 9px;min-height:0;grid-template-columns:auto minmax(0,1fr)}
.ana-rows.tight .ana-row>span:first-child{font-size:12.5px;font-weight:700;color:var(--sub)}
.ana-rows.tight .ana-row b{font-size:13.5px;font-weight:800;color:#2A343F}
.ana-eye-note{margin:4px 12px 12px;padding:10px 12px;border-radius:12px;background:#F4F8F5;
  font-size:11.5px;line-height:1.6;font-weight:700;color:#4E5968;word-break:keep-all}
.ana-foot{gap:6px;padding:12px 15px 14px}
.ana-foot span{font-size:11.5px;font-weight:700;line-height:1.45}
.ana-detail{margin-top:6px}
@media (min-width:960px){
  .ana-row{min-height:48px}
  .ana-row>span:first-child{font-size:13.5px}
  .ana-row b{font-size:15px}
}
.ana-rows.tight .ana-row>span:first-child{white-space:normal;word-break:keep-all}

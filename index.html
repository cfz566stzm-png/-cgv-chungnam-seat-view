<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>충남 시네마 시야 — CGV 충남 8개 지점 좌석 시야 지도</title>
<meta name="description" content="CGV 충남 8개 지점(천안터미널·천안펜타포트·천안·아산·서산·당진·논산·홍성)의 실제 예매 좌석표로 좌석별 시야각·거리·가림을 계산해 미리 보는 서비스.">
<meta name="theme-color" content="#F2F4F6">
<style>
/* ===== 충남 시네마 시야 — KakaoBank/Toss 톤 핀테크 UI ===== */
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');

:root{
  --bg:#F2F4F6;
  --card:#FFFFFF;
  --ink:#191F28;
  --ink-2:#333D4B;
  --sub:#6B7684;
  --mute:#8B95A1;
  --line:#E8EBED;
  --line-2:#F2F4F6;
  --green:#00A862;
  --green-d:#047857;
  --green-dd:#065F46;
  --green-l:#ECFDF5;
  --green-soft:#D1FAE5;
  --mint:#F0FBF5;
  --amber:#F59E0B;
  --amber-l:#FEF3C7;
  --rose:#F04452;
  --rose-l:#FFE9EC;
  --blue:#3182F6;
  --r-xl:26px;
  --r-lg:20px;
  --r-md:14px;
  --r-sm:10px;
  --sh-1:0 1px 2px rgba(25,31,40,.04), 0 4px 16px rgba(25,31,40,.05);
  --sh-2:0 2px 8px rgba(25,31,40,.06), 0 12px 32px rgba(25,31,40,.08);
  --sh-sheet:0 -8px 40px rgba(25,31,40,.14);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  font-feature-settings:'tnum' 1,'ss01' 1;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-.01em;
  font-size:16px;
  line-height:1.5;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(242,244,246,.86);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid rgba(232,235,237,.7);
}
.topbar-in{max-width:1120px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:34px;height:34px;border-radius:12px;background:linear-gradient(150deg,var(--green) 0%,var(--green-dd) 100%);
  display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,168,98,.28);flex:0 0 auto;
}
.brand-mark svg{width:19px;height:19px}
.brand-name{font-size:16.5px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.brand-sub{font-size:12px;color:var(--mute);font-weight:600;margin-top:-2px}
.topbar-spacer{flex:1}
.top-badge{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;
  background:var(--green-l);color:var(--green-d);font-size:12.5px;font-weight:700;
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(0,168,98,.16)}

/* ---------- common ---------- */
.view{padding:22px 0 120px;animation:fade .28s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--r-xl);box-shadow:var(--sh-1)}
.card-pad{padding:22px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 2px 12px}
.section-title h2{font-size:19px;font-weight:800;letter-spacing:-.03em}
.section-title .cap{font-size:13px;color:var(--mute);font-weight:600}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 2px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;height:36px;padding:0 14px;border-radius:999px;background:#fff;color:var(--sub);
  font-size:13.5px;font-weight:700;border:1px solid var(--line);transition:all .18s var(--ease);
  display:inline-flex;align-items:center;gap:6px;
}
.chip:hover{border-color:#D9DEE3}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.sm{height:32px;padding:0 12px;font-size:12.5px}
.chip.green[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 4px 12px rgba(0,168,98,.25)}
.badge{
  display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:8px;
  font-size:11.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;
}
.badge.imax{background:#E8F3FF;color:#1B64DA}
.badge.fourdx{background:#EEF0FF;color:#5B5BD6}
.badge.screenx{background:#FFF1E6;color:#C2410C}
.badge.recliner{background:var(--green-l);color:var(--green-d)}
.badge.laser{background:#F1F3F5;color:#4E5968}
.badge.box{background:#FDF2F8;color:#BE185D}
.badge.art{background:#F5F3FF;color:#6D28D9}
.badge.bean{background:#FFFBEB;color:#B45309}
.badge.plain{background:var(--line-2);color:var(--sub)}
.badge.ok{background:var(--green-l);color:var(--green-d)}
.badge.soon{background:#FFF7ED;color:#B45309}
.badge.work{background:#F1F3F5;color:var(--mute)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;height:48px;padding:0 20px;
  border-radius:16px;background:var(--green);color:#fff;font-size:15px;font-weight:800;
  letter-spacing:-.02em;transition:transform .14s var(--ease),box-shadow .18s var(--ease);
  box-shadow:0 6px 16px rgba(0,168,98,.22);
}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sm{height:38px;padding:0 14px;border-radius:12px;font-size:13.5px;box-shadow:none}
.muted{color:var(--mute)}
.sub{color:var(--sub)}
.hr{height:1px;background:var(--line);margin:18px 0;border:0}

/* ---------- hero ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:var(--r-xl);
  background:linear-gradient(135deg,#047857 0%,#00A862 52%,#34D399 100%);
  color:#fff;padding:28px 26px 24px;box-shadow:0 14px 40px rgba(4,120,87,.24);
}
.hero:before{content:"";position:absolute;width:280px;height:280px;right:-70px;top:-120px;border-radius:50%;background:rgba(255,255,255,.13)}
.hero:after{content:"";position:absolute;width:180px;height:180px;right:40px;bottom:-110px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero h1{font-size:26px;line-height:1.32;font-weight:850;letter-spacing:-.04em;position:relative}
.hero p{margin-top:8px;font-size:14px;color:rgba(255,255,255,.86);font-weight:600;position:relative}
.hero-stats{display:flex;gap:10px;margin-top:22px;position:relative}
.hstat{flex:1;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:12px 13px;backdrop-filter:blur(4px)}
.hstat b{display:block;font-size:20px;font-weight:850;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hstat span{font-size:11.5px;font-weight:700;color:rgba(255,255,255,.8)}

/* ---------- theater cards ---------- */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.tcard{
  background:#fff;border-radius:22px;padding:18px 18px 16px;box-shadow:var(--sh-1);
  transition:transform .16s var(--ease),box-shadow .2s var(--ease);text-align:left;width:100%;
  border:1px solid transparent;
}
.tcard:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:var(--green-soft)}
.tcard-top{display:flex;align-items:flex-start;gap:12px}
.tlogo{
  width:44px;height:44px;border-radius:14px;background:var(--mint);color:var(--green-d);
  display:grid;place-items:center;font-weight:850;font-size:15px;flex:0 0 auto;border:1px solid var(--green-soft);
}
.tname{font-size:16.5px;font-weight:800;letter-spacing:-.03em}
.tregion{font-size:12.5px;color:var(--mute);font-weight:600;margin-top:1px}
.tbadges{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.tmeta{display:flex;gap:14px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line-2)}
.tmeta div{font-size:12px;color:var(--mute);font-weight:700}
.tmeta b{display:block;font-size:16px;color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.progress{height:6px;border-radius:99px;background:var(--line-2);margin-top:12px;overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),#34D399)}

/* ---------- theater detail ---------- */
.back{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 8px;border-radius:10px;color:var(--sub);font-weight:700;font-size:13.5px;background:#fff;box-shadow:var(--sh-1)}
.back:hover{color:var(--ink)}
.thead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:16px 2px 6px;flex-wrap:wrap}
.thead h1{font-size:28px;font-weight:850;letter-spacing:-.04em}
.thead .addr{font-size:13.5px;color:var(--sub);margin-top:6px;font-weight:600}
.notice{
  display:flex;gap:10px;margin-top:16px;padding:14px 16px;border-radius:16px;background:#fff;
  border:1px solid var(--line);font-size:13px;color:var(--sub);font-weight:600;line-height:1.6;
}
.notice b{color:var(--ink);font-weight:800}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px;margin-top:14px}
.hcard{
  background:#fff;border-radius:20px;padding:16px;box-shadow:var(--sh-1);text-align:left;width:100%;
  border:1px solid transparent;transition:transform .15s var(--ease),box-shadow .2s var(--ease);
  display:flex;flex-direction:column;gap:10px;min-height:132px;
}
.hcard:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:var(--green-soft)}
.hcard.disabled{opacity:.72;cursor:default}
.hcard.disabled:hover{transform:none;box-shadow:var(--sh-1);border-color:transparent}
.hcard-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hname{font-size:16px;font-weight:800;letter-spacing:-.02em}
.hseats{font-size:13px;color:var(--mute);font-weight:700}
.hseats b{color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- hall view ---------- */
.hall-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.hall-head h1{font-size:25px;font-weight:850;letter-spacing:-.04em}
.conf{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cbadge{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:8px;font-size:11.5px;font-weight:800;background:#fff;border:1px solid var(--line);color:var(--sub)}
.cbadge.a{background:var(--green-l);border-color:var(--green-soft);color:var(--green-d)}
.cbadge.c{background:#FFF7ED;border-color:#FDE68A;color:#B45309}
.layout{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}

/* seat map */
.mapcard{padding:18px 18px 14px}
.screenbar{
  position:relative;height:30px;border-radius:8px;background:linear-gradient(180deg,#E9FBF2,#F7FDFA);
  border:1px solid var(--green-soft);display:grid;place-items:center;margin-bottom:6px;overflow:hidden;
}
.screenbar span{font-size:11px;font-weight:800;color:var(--green-d);letter-spacing:.12em}
.screenbar:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--green),transparent);opacity:.55}
.maptools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 12px;flex-wrap:wrap}
.seatmap-scroll{overflow-x:auto;padding-bottom:4px}
.seatmap{display:flex;flex-direction:column;gap:3px;min-width:min-content;margin:0 auto;width:max-content}
.srow{display:grid;gap:3px;align-items:center}
.rlab{font-size:10.5px;font-weight:800;color:var(--mute);display:grid;place-items:center;min-width:16px;font-variant-numeric:tabular-nums}
.seat{
  position:relative;aspect-ratio:1/.92;border-radius:5px;background:var(--line-2);
  transition:transform .12s var(--ease),box-shadow .16s var(--ease),background .16s var(--ease);
  display:grid;place-items:center;font-size:8px;color:transparent;font-weight:800;
  border:1px solid transparent;
}
.seat[data-t="n"]{background:#DCEDE4}
.seat[data-t="p"]{background:#BFE3FA}
.seat[data-t="r"]{background:#DCD8FB}
.seat[data-t="s"]{background:#FBD5E8}
.seat[data-t="c"]{background:#FDE7C3}
.seat[data-t="b"]{background:#E7E4DD}
.seat[data-t="x"]{background:#EDEFF1;opacity:.45}
.seat.empty{background:transparent;pointer-events:none}
.seat:hover{transform:scale(1.16);box-shadow:0 4px 12px rgba(25,31,40,.14);z-index:3}
.seat.sel{box-shadow:0 0 0 2.5px var(--green-d),0 6px 16px rgba(4,120,87,.3);z-index:4;transform:scale(1.12)}
.seat.best:after{
  content:"★";position:absolute;top:-6px;right:-4px;font-size:9px;color:var(--amber);
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.2));
}
.heat .seat{color:transparent}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2)}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sub);font-weight:700}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* top5 */
.topseats{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-top:13px;border-top:1px solid var(--line-2);scrollbar-width:none}
.topseats::-webkit-scrollbar{display:none}
.topseat{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 12px;border-radius:12px;background:var(--green-l);border:1px solid var(--green-soft);flex:0 0 auto;transition:transform .14s var(--ease)}
.topseat:hover{transform:translateY(-1px)}
.topseat b{width:18px;height:18px;border-radius:6px;background:var(--green);color:#fff;font-size:11px;display:grid;place-items:center;font-weight:800}
.topseat span{font-size:13px;font-weight:800;color:var(--green-dd);font-variant-numeric:tabular-nums}
.topseat i{font-style:normal;font-size:12px;font-weight:800;color:var(--green-d);opacity:.75;font-variant-numeric:tabular-nums}

/* seat panel */
.panel{position:sticky;top:78px}
@media (max-width:900px){.panel{position:static}}
.empty-state{padding:40px 24px;text-align:center}
.empty-ic{width:64px;height:64px;border-radius:22px;background:var(--mint);display:grid;place-items:center;margin:0 auto 14px;border:1px solid var(--green-soft)}
.empty-state h3{font-size:16.5px;font-weight:800;letter-spacing:-.02em}
.empty-state p{font-size:13px;color:var(--mute);font-weight:600;margin-top:6px;line-height:1.6}
.reco{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.reco button{height:40px;padding:0 14px;border-radius:12px;background:var(--green-l);color:var(--green-d);font-weight:800;font-size:13px;border:1px solid var(--green-soft)}
.reco button:hover{background:var(--green-soft)}

.seat-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.seat-title{font-size:22px;font-weight:850;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.seat-sub{font-size:12.5px;color:var(--mute);font-weight:700;margin-top:2px}
.score-wrap{display:flex;align-items:center;gap:16px;margin-top:18px}
.ring{position:relative;width:92px;height:92px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:25px;font-weight:850;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.grade{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:850}
.grade.g1{background:var(--green-l);color:var(--green-d)}
.grade.g2{background:#E7F8F0;color:#0E9F6E}
.grade.g3{background:#F1F3F5;color:#4E5968}
.grade.g4{background:var(--amber-l);color:#B45309}
.grade.g5{background:var(--rose-l);color:#C0333F}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:18px}
.metric{background:#FAFBFC;border-radius:14px;padding:11px 12px;border:1px solid var(--line-2)}
.metric span{display:block;font-size:11.5px;color:var(--mute);font-weight:700}
.metric b{font-size:17px;font-weight:850;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.metric b i{font-size:11.5px;font-weight:800;color:var(--mute);font-style:normal;margin-left:2px}

.canvas-card{margin-top:14px;border-radius:18px;overflow:hidden;background:#0B1210;position:relative}
.canvas-card canvas{display:block;width:100%;height:auto}
.canvas-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 8px;color:#fff}
.canvas-head b{font-size:12px;font-weight:800;letter-spacing:-.01em}
.canvas-head span{font-size:11px;color:rgba(255,255,255,.55);font-weight:700}
.profile-card{margin-top:10px;border-radius:18px;background:#FAFBFC;border:1px solid var(--line-2);padding:8px 8px 4px}
.profile-card canvas{display:block;width:100%;height:auto}
.tastes{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

.ugc{margin-top:16px}
.ugc-title{display:flex;align-items:center;justify-content:space-between}
.ugc-title h3{font-size:15px;font-weight:800;letter-spacing:-.02em}
.stars{display:flex;gap:3px}
.stars button{font-size:19px;color:#DDE2E6;line-height:1;transition:transform .12s var(--ease)}
.stars button.on{color:var(--amber)}
.stars button:hover{transform:scale(1.14)}
.tagpick{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tagpick button{height:32px;padding:0 11px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--sub)}
.tagpick button[aria-pressed="true"]{background:var(--green-l);border-color:var(--green-soft);color:var(--green-d)}
textarea.review{
  width:100%;margin-top:10px;min-height:74px;resize:vertical;border-radius:14px;border:1px solid var(--line);
  padding:12px 13px;font-family:inherit;font-size:13.5px;color:var(--ink);background:#fff;outline:none;line-height:1.55;
}
textarea.review:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,168,98,.12)}
.review-list{margin-top:14px;display:grid;gap:8px}
.review{background:#FAFBFC;border:1px solid var(--line-2);border-radius:14px;padding:12px 13px}
.review-top{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--mute);font-weight:700}
.review p{font-size:13.5px;color:var(--ink-2);margin-top:6px;line-height:1.55}
.review .rts{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.review .rts span{font-size:11px;font-weight:800;color:var(--green-d);background:var(--green-l);padding:3px 8px;border-radius:7px}
.helpful{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:9px;background:#fff;border:1px solid var(--line);font-size:11.5px;font-weight:800;color:var(--sub)}

/* bottom sheet (mobile seat detail) */
.sheet{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;
  border-radius:26px 26px 0 0;box-shadow:var(--sh-sheet);max-height:88vh;overflow:auto;
  padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);
  transition:transform .32s var(--ease);
}
.sheet.open{transform:none}
.sheet-grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 10px}
.sheet-close{position:absolute;right:14px;top:12px;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--line-2);color:var(--sub)}
.scrim{display:none;position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:55;opacity:0;transition:opacity .3s var(--ease)}
.scrim.open{display:block;opacity:1}
@media (max-width:900px){
  .desktop-only{display:none!important}
  .panel .card{display:none}
  .sheet{display:block}
  .view{padding-bottom:150px}
}
@media (min-width:901px){
  .mobile-only{display:none!important}
}

/* toast */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:80;
  background:rgba(25,31,40,.94);color:#fff;font-size:13.5px;font-weight:700;
  padding:12px 18px;border-radius:14px;opacity:0;transition:all .26s var(--ease);pointer-events:none;
  box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:calc(100% - 40px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* MY */
.myhead{display:flex;align-items:center;gap:14px}
.avatar{width:56px;height:56px;border-radius:20px;background:linear-gradient(140deg,var(--green),var(--green-dd));display:grid;place-items:center;color:#fff;font-weight:850;font-size:19px;box-shadow:0 8px 20px rgba(0,168,98,.28)}
.badgerow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.badgepill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:10px;background:var(--mint);border:1px solid var(--green-soft);color:var(--green-d);font-size:12px;font-weight:800}
.badgepill.off{background:#F7F8F9;border-color:var(--line);color:var(--mute)}

/* footer */
.foot{margin-top:34px;padding:20px 4px;font-size:11.5px;color:var(--mute);line-height:1.7;font-weight:600}
.foot b{color:var(--sub)}

/* ===== V2 오버라이드 (모바일·실사 사진) ===== */
/* ================= V2: 모바일 오버플로·실사 사진·탭 ================= */
/* 1) 가로 넘침 차단 */
html,body{max-width:100%;overflow-x:hidden}
*,*:before,*:after{box-sizing:border-box}
.wrap{width:100%;max-width:1120px}
.card,.panel,.layout>*,.hgrid>*,.tgrid>*{min-width:0;max-width:100%}
img,canvas,svg,video{max-width:100%}
.canvas-card canvas,.profile-card canvas{display:block;width:100%;height:auto}
.seatmap-scroll{max-width:100%}
.seatmap{width:100%;min-width:0;margin:0}
.srow{min-width:0}
.seat{min-width:0}

/* 2) 칩 줄바꿈 */
.chip-row.wrap{flex-wrap:wrap;overflow:visible}
.maptools{flex-wrap:wrap;gap:8px;align-items:flex-start}
.maptools .chip-row{flex-wrap:wrap;overflow:visible}
.topseats{flex-wrap:wrap;overflow:visible}
.aspect-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.aspect-label{font-size:12.5px;color:var(--mute);font-weight:800;white-space:nowrap;flex:0 0 auto}

/* 3) 입력 요소 iOS 자동확대 방지 */
input,select,textarea,.review,#reviewText{font-size:16px !important;line-height:1.45}
.ugc,.ugc *{max-width:100%;box-sizing:border-box}
.review{width:100%;min-height:84px}
.ugc form,.ugc .formbox{width:100%;max-width:100%;overflow-x:hidden}
select.moviesel{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 12px;color:var(--ink);font-weight:700}

/* 4) 지점 이니셜 배지 */
.tlogo{white-space:nowrap;font-size:13.5px;letter-spacing:-.03em;line-height:1}

/* 5) 좌석 실사 배지 */
.seat .cam{
  position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;
  background:var(--green);border:1.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.2);
}
.seat.hascam{box-shadow:0 0 0 1.5px rgba(0,168,98,.55) inset}
.seat.dim{opacity:.18}
.seat.dim:hover{opacity:.4}
.photochip{background:var(--green-l);border-color:var(--green-soft);color:var(--green-d)}
.photochip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}

/* 6) 실사 모아보기 */
.gallery{margin-top:18px}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gal-item{position:relative;border-radius:14px;overflow:hidden;background:#0B1210;border:1px solid var(--line);text-align:left}
.gal-item img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.gal-cap{position:absolute;left:0;right:0;bottom:0;padding:14px 9px 7px;color:#fff;font-size:12px;font-weight:800;
  background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.72));display:flex;justify-content:space-between;align-items:center;gap:6px}
.gal-cap .t{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.2)}

/* 7) 좌석 패널 탭 */
.ptabs{display:flex;gap:6px;margin-top:16px;background:var(--line-2);padding:4px;border-radius:14px}
.ptabs button{flex:1;height:38px;border-radius:11px;font-size:13px;font-weight:800;color:var(--sub);white-space:nowrap}
.ptabs button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(25,31,40,.12)}
.ptabs button:disabled{opacity:.4}
.tabbody{margin-top:14px}

/* 8) 실사 사진 뷰어 */
.pv{border-radius:18px;overflow:hidden;background:#0B1210;position:relative}
.pv img{display:block;width:100%;height:auto}
.pv-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:#0B1210;color:#fff}
.pv-bar b{font-size:12px;font-weight:800}
.pv-bar span{font-size:11px;font-weight:700;color:rgba(255,255,255,.6)}
.pv-switch{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pv-switch button{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:800;color:var(--sub)}
.pv-switch button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pcred{margin-top:12px;border:1px solid var(--line-2);background:#FAFBFC;border-radius:14px;padding:12px 13px}
.pcred .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:7px}
.pcred dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:12px;color:var(--sub);font-weight:600}
.pcred dt{color:var(--mute);font-weight:800;white-space:nowrap}
.pcred a{color:var(--green-d);font-weight:800;text-decoration:none;word-break:break-all}
.ticketmini{display:flex;gap:10px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.ticketmini img{width:56px;border-radius:8px}
.emptyphoto{padding:26px 18px;text-align:center;border:1px dashed var(--line);border-radius:16px;background:#FAFBFC}
.emptyphoto b{display:block;font-size:14px;font-weight:800;margin-bottom:6px}
.emptyphoto p{font-size:12.5px;color:var(--mute);font-weight:600;line-height:1.6}

/* 9) UGC */
.moviepick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.moviepick button{height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:700;color:var(--sub)}
.moviepick button[aria-pressed="true"]{background:var(--green-l);border-color:var(--green-soft);color:var(--green-d)}
.filebtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 14px;border-radius:12px;background:#fff;border:1px dashed var(--line);font-size:12.5px;font-weight:800;color:var(--sub);cursor:pointer;width:100%}
.filebtn input{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.thumbs figure{margin:0;position:relative}
.thumbs img{width:64px;height:48px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.thumbs figcaption{font-size:10px;color:var(--mute);font-weight:800;text-align:center;margin-top:2px}
.review .movie{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:7px;background:#EEF2FF;color:#3B4FCB;font-size:11px;font-weight:800;margin-bottom:6px}
.review .ticketbadge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:7px;background:var(--green-l);color:var(--green-d);font-size:11px;font-weight:800;margin-left:4px}
.review .shots{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.review .shots img{width:70px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.reviewcard{cursor:pointer;transition:transform .15s var(--ease),box-shadow .18s var(--ease)}
.reviewcard:hover{transform:translateY(-1px);box-shadow:var(--sh-2)}

@media (max-width:900px){
  .view{padding:16px 0 120px}
  .wrap{padding:0 16px}
  .mapcard{padding:14px 12px 12px}
  .seatmap .srow{gap:2px}
  .seat{font-size:0;border-radius:4px}
  .topseats .topseat{flex:1 1 30%}
  .gal-grid{grid-template-columns:repeat(2,1fr)}
  .ptabs button{font-size:12.5px}
  .metrics{grid-template-columns:repeat(2,1fr)}
}

/* 10) 뒤로가기 버튼 터치 보강 */
.back{position:relative;z-index:6;min-height:44px;display:inline-flex;align-items:center;gap:6px;
  pointer-events:auto;touch-action:manipulation;cursor:pointer;padding:8px 14px 8px 10px;
  margin:-2px 0 8px -4px;border-radius:14px;background:#fff;border:1px solid var(--line);font-weight:800;font-size:13.5px;color:var(--sub)}
.back:active{background:#EDF0F2}
.back svg{pointer-events:none;flex:0 0 auto}
.back.mini{min-height:36px;font-size:12.5px;padding:6px 12px}

/* 11) 원문 링크 카드 (외부 사진 재게시 대신) */
.extphoto{border:1px solid var(--line);border-radius:18px;background:#FAFBFC;padding:16px}
.extphoto-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.extphoto-top b{font-size:14px;font-weight:850}
.extphoto-top span{font-size:11.5px;font-weight:800;color:var(--green-d);background:var(--green-l);padding:3px 8px;border-radius:7px}
.extphoto p{font-size:12.5px;color:var(--sub);font-weight:600;line-height:1.6;margin:10px 0 12px}
.extphoto-foot{font-size:11px;color:var(--mute);font-weight:600;margin-top:10px;line-height:1.5}
.gal-noimg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;aspect-ratio:4/3;background:linear-gradient(140deg,#E8F6EF,#F7FBF9);color:var(--green-d);font-size:22px}
.gal-noimg span{font-size:11px;font-weight:800}

/* 12) 닉네임 모달 */
.modal{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-scrim{position:absolute;inset:0;background:rgba(25,31,40,.42)}
.modal-card{position:relative;width:100%;max-width:480px;background:#fff;border-radius:26px 26px 0 0;padding:20px 20px 26px;box-shadow:0 -10px 40px rgba(25,31,40,.2);animation:sheetUp .26s var(--ease)}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.modal-grab{width:40px;height:4px;border-radius:99px;background:#E1E5E9;margin:0 auto 14px}
.modal-card h3{font-size:18px;font-weight:850;letter-spacing:-.03em}
.modal-card .sub{font-size:12.5px;color:var(--mute);font-weight:600;line-height:1.6;margin-top:6px}
.nickinput{width:100%;height:50px;margin-top:16px;border-radius:14px;border:1px solid var(--line);background:#F7F9FA;padding:0 14px;font-size:16px;font-weight:700;color:var(--ink)}
.nickinput:focus{outline:none;border-color:var(--green);background:#fff}
.avatar{background:var(--green-l);color:var(--green-d);font-weight:850;font-size:16px}

/* 13) 모바일 좌석 칸 높이·브랜드 부제 */
.brand-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
@media (max-width:900px){
  .seat{aspect-ratio:auto;min-height:13px;border-radius:4px}
  .srow{gap:2px !important}
  .rlab{font-size:9.5px;min-width:12px}
}

/* 14) 모바일 시트 내부 중복 뒤로가기 제거 */
#sheet .back.mini{display:none}

</style>

  const tierLabel = (t) => (t === '1x' ? '1배율' : t === 'wide' ? '광각' : '실사');

  /* ---------- 물리 계산 ---------- */
  function metrics(p, seat) {
    const centerX = (p.minx + p.maxx) / 2;
    const sx = (seat.x - centerX) * p.pitch;
    const d0 = p.firstRow + seat.y * p.rowGap;
    const eyeY = p.eye + seat.y * p.riser;
    const distAt = (u) => d0 - p.curve * Math.pow((2 * u) / p.screenW, 2);
    const dL = distAt(-p.screenW / 2), dR = distAt(p.screenW / 2), dC = distAt(0);
    const aL = Math.atan2(-p.screenW / 2 - sx, dL) / D2R;
    const aR = Math.atan2(p.screenW / 2 - sx, dR) / D2R;
    const hFov = aR - aL;
    const yTop = p.screenBottom + p.screenH;
    const vTop = Math.atan2(yTop - eyeY, dC) / D2R;
    const vBot = Math.atan2(p.screenBottom - eyeY, dC) / D2R;
    const vFov = vTop - vBot;
    const neck = Math.atan2(p.screenBottom + p.screenH / 2 - eyeY, dC) / D2R;
    const yaw = Math.atan2(sx, dC) / D2R;
    const dist = Math.hypot(dC, sx);
    let occ = 0;
    for (let r = 0; r < seat.y; r++) {
      const headTop = p.eye + r * p.riser + p.headDelta;
      const ang = Math.atan2(headTop - eyeY, (seat.y - r) * p.rowGap) / D2R;
      if (ang > vBot) occ = Math.max(occ, ((Math.min(ang, vTop) - vBot) / vFov) * 100);
    }
    return { hFov, vFov, neck, yaw, dist, occ, dC, aL, aR, vTop, vBot, eyeY, sx, steps: seat.y * p.riser };
  }

  /* ---------- URL 해시 라우팅 ---------- */
  function hashOf(st) {
    if (st.view === 'my') return '#/my';
    if (st.view === 'theater' && st.theaterId) return '#/t/' + st.theaterId;
    if (st.view === 'hall' && st.hallId) return '#/t/' + st.theaterId + '/h/' + st.hallId + (st.seatKey ? '/s/' + st.seatKey : '');
    return '#/';
  }
  function syncHash(push) {
    const h = hashOf(state);
    if (location.hash === h) return;
    try { (push ? history.pushState : history.replaceState).call(history, { h }, '', h); } catch (e) { location.hash = h; }
  }
  function applyHash() {
    const seg = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    if (!seg.length) { state.view = 'home'; state.theaterId = null; state.hallId = null; state.seatKey = null; return; }
    if (seg[0] === 'my') { state.view = 'my'; return; }
    if (seg[0] === 't' && seg[1]) {
      state.theaterId = seg[1];
      if (seg[2] === 'h' && seg[3]) {
        state.hallId = seg[3]; state.view = 'hall';
        state.seatKey = (seg[4] === 's' && seg[5]) ? decodeURIComponent(seg[5]) : null;
        const hh = findHall(state.theaterId, state.hallId);
        state.aspect = hh ? String(hh.params.aspect) : null;
        state.photoIdx = 0; state.tab = 'photo';
      } else { state.view = 'theater'; state.hallId = null; state.seatKey = null; }
      return;
    }
    state.view = 'home';
  }

    if (body) body.innerHTML = html;

        if (pc) drawProfile(pc, p, m, seat);

  /* ---------- UGC ---------- */
  function ugcKey() { return state.theaterId + '/' + state.hallId; }
  function ugcBucket() {
    const k = ugcKey();
    store[k] = store[k] || { seats: {}, list: [] };
    return store[k];
  }

      <div class="review-list" id="reviewList">

          ${r.movie ? `<span class="movie">🎬 ${esc(r.movie)}</span>` : ''}${r.ticket ? `<span class="ticketbadge">티켓 인증</span>` : ''}
          ${r.text ? `<p>${esc(r.text)}</p>` : ''}

          ${(r.shots && r.shots.length) || r.ticket ? `<div class="shots">${r.ticket ? `<img src="${r.ticket}" alt="티켓">` : ''}${(r.shots || []).map((s) => `<img src="${s}" alt="시야">`).join('')}</div>` : ''}
          <div style="margin-top:8px"><button class="helpful" data-helpful="${r.id}">👍 도움돼요 ${r.help || 0}</button></div>

  let draft = { rating: 0, tags: [], ticket: null, shots: [] };

  function compressImage(file, maxW, q) {
    return new Promise((resolve) => {
      const fr = new FileReader();
      fr.onload = () => {
        const im = new Image();
        im.onload = () => {
          const sc = Math.min(1, maxW / im.width);
          const c = document.createElement('canvas');
          c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
          c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
          try { resolve(c.toDataURL('image/jpeg', q)); } catch (e) { resolve(null); }
        };
        im.onerror = () => resolve(null);
        im.src = fr.result;
      };
      fr.onerror = () => resolve(null);
      fr.readAsDataURL(file);
    });
  }

  function bindUgc(h, seat) {
    const bucket = ugcBucket();
    const mine = bucket.seats[seat.key] || null;
    draft = { rating: mine ? mine.rating : 0, tags: mine ? [...(mine.tags || [])] : [], ticket: mine ? mine.ticket || null : null, shots: mine ? [...(mine.shots || [])] : [] };
    const root = (document.getElementById('sheetBody') && window.innerWidth <= 900) ? document.getElementById('sheetBody') : document.getElementById('seatPanel');
    if (!root) return;
    root.querySelectorAll('#stars button').forEach((b) => {
      b.onclick = () => { draft.rating = +b.dataset.star; root.querySelectorAll('#stars button').forEach((x) => x.classList.toggle('on', +x.dataset.star <= draft.rating)); };
    });
    root.querySelectorAll('#tags button').forEach((b) => {
      b.onclick = () => {
        const tg = b.dataset.tag; const i = draft.tags.indexOf(tg);
        if (i >= 0) draft.tags.splice(i, 1); else draft.tags.push(tg);
        b.setAttribute('aria-pressed', i < 0);
      };
    });
    const sel = root.querySelector('#movieSel');
    const cust = root.querySelector('#movieCustom');
    if (sel && cust) sel.onchange = () => { cust.style.display = sel.value === '__custom' ? 'block' : 'none'; if (sel.value === '__custom') cust.focus(); };

    const tf = root.querySelector('#ticketFile');
    if (tf) tf.onchange = async () => {
      const f = tf.files && tf.files[0]; if (!f) return;
      const d = await compressImage(f, 420, 0.62);
      if (d) { draft.ticket = d; toast('티켓 사진을 첨부했어요'); const th = root.querySelector('#thumbs'); if (th) th.insertAdjacentHTML('afterbegin', `<figure><img src="${d}" alt="티켓"><figcaption>티켓</figcaption></figure>`); }
    };
    const sf = root.querySelector('#shotFile');
    if (sf) sf.onchange = async () => {
      const f = sf.files && sf.files[0]; if (!f) return;
      const d = await compressImage(f, 560, 0.62);
      if (d) { draft.shots.push(d); toast('시야 사진을 첨부했어요'); const th = root.querySelector('#thumbs'); if (th) th.insertAdjacentHTML('beforeend', `<figure><img src="${d}" alt="시야"><figcaption>시야</figcaption></figure>`); }
    };

    const saveBtn = root.querySelector('#saveReview');
    if (saveBtn) saveBtn.onclick = () => {
      if (!draft.rating) { toast('별점을 먼저 남겨주세요'); return; }
      let movie = sel ? sel.value : '';
      if (movie === '__custom') movie = cust ? cust.value.trim().slice(0, 40) : '';
      const text = root.querySelector('#reviewText').value.trim().slice(0, 300);
      const bucket2 = ugcBucket();
      const prev = bucket2.seats[seat.key];
      const id = prev && prev.id ? prev.id : 'r' + Date.now();
      const rec = { id, seat: seat.key, hall: h.name, author: nickname || '익명', rating: draft.rating, tags: [...draft.tags], text, movie, ticket: draft.ticket || null, shots: [...draft.shots], date: new Date().toISOString().slice(0, 10) };
      bucket2.seats[seat.key] = rec;
      bucket2.list = bucket2.list.filter((r) => !(r.seat === seat.key && r.id === id));
      bucket2.list.unshift({ ...rec, help: prev ? prev.help || 0 : 0 });
      bucket2.list = bucket2.list.slice(0, 60);
      save(); paintSeatPanel(); toast('후기를 저장했어요');
    };
    root.querySelectorAll('[data-helpful]').forEach((b) => {
      b.onclick = () => {
        const bucket3 = ugcBucket();
        const r = bucket3.list.find((x) => x.id === b.dataset.helpful);
        if (!r) return; r.help = (r.help || 0) + 1; save(); b.textContent = '👍 도움돼요 ' + r.help;
      };
    });
  }

  function contribution() {
    let seats = 0, reviews = 0, photos = 0;
    Object.values(store).forEach((b) => {
      reviews += (b.list || []).length;
      seats += Object.keys(b.seats || {}).length;
      Object.values(b.seats || {}).forEach((s) => { photos += (s.shots || []).length + (s.ticket ? 1 : 0); });
    });
    return { seats, reviews, photos };
  }

  /* ---------- 캔버스: 1인칭 시야 ---------- */
  function drawView(canvas, p, m, hall, seat) {
    const W = canvas.width, H = canvas.height;
    const ctx = canvas.getContext('2d');
    const aspect = Number(state.aspect);
    const HSPAN = 118;
    const VSPAN = HSPAN * (H / W);
    const gx = state.mode === 'center' ? (m.aL + m.aR) / 2 : 0;
    const gv = state.mode === 'center' ? m.neck : 0;
    const X = (a) => W / 2 + ((a - gx) / HSPAN) * W;
    const Y = (a) => H / 2 - ((a - gv) / VSPAN) * H;

    ctx.clearRect(0, 0, W, H);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0A0F0D'); bg.addColorStop(0.5, '#0E1613'); bg.addColorStop(1, '#090D0B');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,255,255,.035)';
    ctx.fillRect(0, Y(m.vBot), W, H - Y(m.vBot));
    ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.beginPath();
    ctx.moveTo(0, Y(m.vBot)); ctx.lineTo(W, Y(m.vBot)); ctx.stroke();

    const sx0 = X(m.aL), sx1 = X(m.aR), sy0 = Y(m.vTop), sy1 = Y(m.vBot);
    ctx.fillStyle = '#141B18'; ctx.fillRect(sx0, sy0, sx1 - sx0, sy1 - sy0);
    ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(sx0, sy0, sx1 - sx0, sy1 - sy0);

    const scrAspect = p.screenW / p.screenH;
    let iw = p.screenW, ih = p.screenW / aspect;
    if (ih > p.screenH) { ih = p.screenH; iw = p.screenH * aspect; }
    const uL = -iw / 2, uR = iw / 2;
    const distAt = (u) => m.dC - p.curve * Math.pow((2 * u) / p.screenW, 2);
    const angH = (u) => Math.atan2(u - m.sx, distAt(u)) / D2R;
    const centerY = p.screenBottom + p.screenH / 2;
    const iTop = Math.atan2(centerY + ih / 2 - m.eyeY, m.dC) / D2R;
    const iBot = Math.atan2(centerY - ih / 2 - m.eyeY, m.dC) / D2R;
    const ix0 = X(angH(uL)), ix1 = X(angH(uR)), iy0 = Y(iTop), iy1 = Y(iBot);

    ctx.save();
    ctx.beginPath(); ctx.rect(ix0, iy0, ix1 - ix0, iy1 - iy0); ctx.clip();
    const iw2 = ix1 - ix0, ih2 = iy1 - iy0;
    const sky = ctx.createLinearGradient(0, iy0, 0, iy1);
    sky.addColorStop(0, '#10243A'); sky.addColorStop(.34, '#5B4B6B'); sky.addColorStop(.56, '#D9764C');
    sky.addColorStop(.74, '#F2B45E'); sky.addColorStop(.88, '#8C5A3C'); sky.addColorStop(1, '#241A1D');
    ctx.fillStyle = sky; ctx.fillRect(ix0, iy0, iw2, ih2);
    const sunR = Math.max(6, ih2 * .05);
    ctx.fillStyle = 'rgba(255,236,190,.92)';
    ctx.beginPath(); ctx.arc(ix0 + iw2 * .63, iy0 + ih2 * .56, sunR, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,210,150,.18)';
    ctx.beginPath(); ctx.arc(ix0 + iw2 * .63, iy0 + ih2 * .56, sunR * 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(22,17,22,.86)';
    ctx.beginPath();
    ctx.moveTo(ix0, iy1); ctx.lineTo(ix0 + iw2 * .16, iy0 + ih2 * .70); ctx.lineTo(ix0 + iw2 * .30, iy1);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(ix0 + iw2 * .52, iy1); ctx.lineTo(ix0 + iw2 * .78, iy0 + ih2 * .64); ctx.lineTo(ix1, iy1);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.94)';
    ctx.font = `600 ${Math.max(9, ih2 * .052)}px Pretendard, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('지금, 이 자리에서 보이는 화면', ix0 + iw2 / 2, iy1 - ih2 * .085);
    ctx.restore();

    for (let r = seat.y - 1; r >= Math.max(0, seat.y - 5); r--) {
      const headTop = p.eye + r * p.riser + p.headDelta;
      const angTop = Math.atan2(headTop - m.eyeY, (seat.y - r) * p.rowGap) / D2R;
      const yy = Y(Math.min(angTop, m.vTop + 4));
      if (yy < 0 || yy > H) continue;
      const alpha = Math.max(.28, .68 - (seat.y - r - 1) * .1);
      const rx = W * (0.055 + (seat.y - r) * 0.005), ry = H * 0.05;
      const hx = X(0) + ((r * 37) % 100 - 50) / 50 * W * 0.11;
      ctx.fillStyle = `rgba(4,6,5,${alpha})`;
      ctx.beginPath(); ctx.ellipse(hx, yy + ry, rx, ry, 0, Math.PI, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(hx, yy + ry * 2.2, rx * 1.7, ry, 0, Math.PI, Math.PI * 2); ctx.fill();
    }

    const seatBackY = H - H * 0.035;
    ctx.fillStyle = 'rgba(3,5,4,.92)';
    for (let i = -3; i <= 3; i++) {
      const bx = W / 2 + i * W * 0.16;
      ctx.beginPath();
      ctx.ellipse(bx, seatBackY + H * 0.06, W * 0.075, H * 0.075, 0, Math.PI, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = 'rgba(4,6,5,.72)';
    if (iy0 > sy0) ctx.fillRect(sx0, sy0, sx1 - sx0, iy0 - sy0);
    if (iy1 < sy1) ctx.fillRect(sx0, iy1, sx1 - sx0, sy1 - iy1);
    if (ix0 > sx0) ctx.fillRect(sx0, sy0, ix0 - sx0, sy1 - sy0);
    if (ix1 < sx1) ctx.fillRect(ix1, sy0, sx1 - ix1, sy1 - sy0);

    ctx.fillStyle = 'rgba(255,255,255,.42)'; ctx.font = '11px Pretendard, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(HSPAN + '° 보기  ·  화면 가로 ' + fmt(m.hFov, 1) + '°', 12, H - 12);
    ctx.textAlign = 'right';
    ctx.fillText(state.aspect + ':1', W - 12, H - 12);
  }

  /* ---------- 캔버스: 단면도 ---------- */
  function drawProfile(canvas, p, m, seat) {
    const W = canvas.width, H = canvas.height;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#FAFBFC'; ctx.fillRect(0, 0, W, H);

    const maxD = p.firstRow + (p.rows - 1) * p.rowGap + 2;
    const maxY = Math.max(p.screenBottom + p.screenH, p.eye + (p.rows - 1) * p.riser + 1.2) + 0.8;
    const padL = 34, padR = 20, padT = 18, padB = 26;
    const X = (mtr) => padL + (mtr / maxD) * (W - padL - padR);
    const Y = (h) => H - padB - (h / maxY) * (H - padT - padB);

    ctx.strokeStyle = '#DDE2E6'; ctx.lineWidth = 1;
    for (let i = 0; i < p.rows; i++) {
      const d0 = p.firstRow + i * p.rowGap - p.rowGap * 0.35;
      const d1 = p.firstRow + i * p.rowGap + p.rowGap * 0.35;
      const y = Y(i * p.riser);
      ctx.beginPath(); ctx.moveTo(X(d0), y); ctx.lineTo(X(d1), y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X(d1), y); ctx.lineTo(X(d1), Y((i + 1) * p.riser)); ctx.stroke();
    }

    ctx.fillStyle = '#047857';
    ctx.fillRect(X(0) - 4, Y(p.screenBottom + p.screenH), 4, Y(p.screenBottom) - Y(p.screenBottom + p.screenH));
    ctx.fillStyle = '#8B95A1'; ctx.font = '10px Pretendard, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('SCREEN', X(0) + 2, Y(p.screenBottom + p.screenH) - 6);

    const centerX = (p.minx + p.maxx) / 2;
    ctx.fillStyle = '#C7CDD3';
    for (let i = 0; i < p.rows; i++) {
      ctx.beginPath(); ctx.arc(X(p.firstRow + i * p.rowGap), Y(p.eye + i * p.riser), 2.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#00A862';
    ctx.beginPath(); ctx.arc(X(p.firstRow + seat.y * p.rowGap), Y(m.eyeY), 4.4, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = 'rgba(0,168,98,.75)'; ctx.lineWidth = 1.4; ctx.setLineDash([4, 3]);
    const seatD = X(p.firstRow + seat.y * p.rowGap), seatY = Y(m.eyeY);
    [[p.screenBottom + p.screenH], [p.screenBottom], [p.screenBottom + p.screenH / 2]].forEach(([yy]) => {
      ctx.beginPath(); ctx.moveTo(seatD, seatY); ctx.lineTo(X(0), Y(yy)); ctx.stroke();
    });
    ctx.setLineDash([]);

    ctx.fillStyle = '#6B7684'; ctx.font = '11px Pretendard, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(`고개 +${fmt(m.neck, 1)}°  ·  단차 ${fmt(m.steps, 1)}m  ·  거리 ${fmt(m.dist, 1)}m`, padL, 14);
  }

  /* ---------- MY ---------- */
  function viewMy() {
    const c = contribution();
    const keys = Object.keys(store).filter((k) => Object.keys((store[k] || {}).seats || {}).length);
    return `
    <div class="card card-pad">
      <div class="myhead">
        <div class="avatar" id="myAvatar">${nickname ? esc(nickname.slice(0, 1)) : '🙂'}</div>
        <div style="flex:1">
          <div style="font-size:19px;font-weight:850;letter-spacing:-.03em">내 좌석 기록</div>
          <div class="seat-sub"><span id="myNick">${esc(nickname || '닉네임 없음')}</span> · 이 기기에만 저장돼요</div>
        </div>
      </div>
      <div class="metrics" style="margin-top:18px">
        <div class="metric"><span>남긴 좌석 후기</span><b class="num">${c.seats}</b></div>
        <div class="metric"><span>작성한 글</span><b class="num">${c.reviews}</b></div>
        <div class="metric"><span>올린 사진</span><b class="num">${c.photos}</b></div>
        <div class="metric"><span>티켓 인증</span><b class="num">${Object.values(store).reduce((a, b) => a + Object.values(b.seats || {}).filter((s) => s.ticket).length, 0)}</b></div>
      </div>
      <button class="chip sm" id="editNick" style="margin-top:14px">닉네임 ${nickname ? '변경' : '설정'}</button>
      <div class="sub" style="font-size:12.5px;margin-top:10px;line-height:1.6;font-weight:600">
        후기·사진은 이 기기 브라우저에만 저장됩니다. 포인트·현금 같은 유상 보상은 운영하지 않아요.
      </div>
    </div>
    <div class="section-title"><h2>내가 남긴 후기</h2><span class="cap">${c.seats}석</span></div>
    ${keys.length === 0 ? `<div class="card empty-state"><div class="empty-ic">💬</div><h3>아직 남긴 후기가 없어요</h3><p>좌석 카드에서 별점과 태그를 남기면<br>여기에 차곡차곡 쌓여요.</p><button class="btn sm" style="margin-top:14px" data-go="home">지점 둘러보기</button></div>` :
        keys.map((k) => {
          const b = store[k]; const t = findTheater(k.split('/')[0]);
          const hid = k.split('/')[1];
          const hh = findHall(k.split('/')[0], hid);
          return Object.values(b.seats || {}).map((r) => `<div class="card card-pad reviewcard" style="margin-bottom:10px" data-go="hall" data-tid="${esc(k.split('/')[0])}" data-hid="${esc(hid)}" data-seat="${esc(r.seat)}" role="button" tabindex="0">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
              <div style="min-width:0"><b style="font-size:15px">${esc(t ? t.name : '')} ${esc(hh ? hh.name : r.hall)} ${esc(r.seat)}</b>
              <div class="seat-sub">${esc(r.date)} · ${'★'.repeat(r.rating)}</div></div>
              <span class="badge ok" style="flex:0 0 auto">보기</span>
            </div>
            ${r.movie ? `<div style="margin-top:8px"><span class="movie">🎬 ${esc(r.movie)}</span>${r.ticket ? '<span class="ticketbadge">티켓 인증</span>' : ''}</div>` : (r.ticket ? `<div style="margin-top:8px"><span class="ticketbadge">티켓 인증</span></div>` : '')}
            ${r.text ? `<p class="sub" style="font-size:13px;margin-top:8px;line-height:1.55">${esc(r.text)}</p>` : ''}
            ${(r.shots && r.shots.length) || r.ticket ? `<div class="shots">${r.ticket ? `<img src="${r.ticket}" alt="티켓">` : ''}${(r.shots || []).map((s) => `<img src="${s}" alt="시야">`).join('')}</div>` : ''}
            ${r.tags && r.tags.length ? `<div class="rts" style="display:flex;gap:5px;flex-wrap:wrap;margin-top:8px">${r.tags.map((x) => `<span class="badge ok">${esc(x)}</span>`).join('')}</div>` : ''}
          </div>`).join('');
        }).join('')}
    <div class="foot">기록은 브라우저 저장소(localStorage)에만 보관되며 외부로 전송되지 않습니다. 브라우저 데이터를 지우면 함께 사라져요.</div>`;
  }

  /* ---------- 이벤트 ---------- */
  document.addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]');
    if (go) {
      const v = go.dataset.go;
      if (v === 'home') { state.view = 'home'; state.theaterId = null; state.hallId = null; state.seatKey = null; }
      if (v === 'theater') { state.view = 'theater'; state.theaterId = go.dataset.id || state.theaterId; state.hallId = null; state.seatKey = null; }
      if (v === 'hall') {
        state.view = 'hall'; state.theaterId = go.dataset.tid; state.hallId = go.dataset.hid;
        state.seatKey = go.dataset.seat || null; state.aspect = null; state.photoIdx = 0; state.tab = 'photo';
        const hh = findHall(state.theaterId, state.hallId); if (hh) state.aspect = String(hh.params.aspect);
      }
      if (v === 'my') state.view = 'my';
      if (v === 'hallback') { state.seatKey = null; syncHash(true); render(); return; }
      syncHash(true);
      render(); return;
    }
    const f = e.target.closest('[data-filter]');
    if (f) { state.filter = f.dataset.filter; render(); return; }
    const s = e.target.closest('[data-seat]');
    if (s) {
      state.seatKey = s.dataset.seat; state.photoIdx = 0;
      if (s.dataset.tabto) state.tab = s.dataset.tabto;
      syncHash(true);
      paintSeatMap(); paintSeatPanel(); return;
    }
    const tabb = e.target.closest('[data-ptab]');
    if (tabb) { state.tab = tabb.dataset.ptab; paintSeatPanel(); return; }
    const ph = e.target.closest('[data-photo]');
    if (ph) { state.photoIdx = +ph.dataset.photo; paintSeatPanel(); return; }
    const po = e.target.closest('[data-photoonly]');
    if (po) { state.photoOnly = !state.photoOnly; render(); return; }
    const pg = e.target.closest('[data-photogal]');
    if (pg) { const g = $('#photoGallery'); if (g) g.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    const a = e.target.closest('[data-aspect]');
    if (a) { state.aspect = a.dataset.aspect; render(); return; }
    const md = e.target.closest('[data-mode]');
    if (md) { state.mode = md.dataset.mode; paintSeatPanel(); return; }
    const soon = e.target.closest('[data-soon]');
    if (soon) { toast('이 상영관은 좌석표를 아직 확인하지 못했어요'); return; }
    if (e.target.closest('#editNick')) { nicknameModal(true); return; }
    if (e.target.closest('#sheetClose') || e.target.id === 'scrim') { openSheet(false); return; }
    const nav = e.target.closest('[data-tab]');
    if (nav) { state.view = nav.dataset.tab; render(); return; }
  });

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') openSheet(false); });

  /* 시작 */
  hallSeats_init();
  function hallSeats_init() {
    DATA.theaters.forEach((t) => t.halls.forEach((h) => { if (h.status === 'ok' && h.rows) hallSeats(h); }));
  }
  applyHash();
  render();
  window.addEventListener('popstate', () => { applyHash(); render(); });
  window.__APP__ = { state, metrics, render, setNickname };
  try {
    if (!localStorage.getItem('cgv-chn-nick-asked')) {
      localStorage.setItem('cgv-chn-nick-asked', '1');
      if (!nickname) setTimeout(() => nicknameModal(false), 500);
    }
  } catch (e) {}
})();

</script>
</body>
</html>

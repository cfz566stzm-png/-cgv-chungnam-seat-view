        <div class="aspect-row">
          <span class="aspect-label">${esc(as.label)}</span>

            ? `<button class="chip green" data-aspect="${v}" aria-pressed="${String(state.aspect) === v}">${l}</button>`

        </div>
        ${imaxAspectNote(h)}

        <div class="card mapcard" style="min-width:0">
          <div class="screenbar"><span>SCREEN ${fmt(p.screenW, 1)} × ${fmt(p.screenH, 1)} m${p.native ? ` · ${Number(p.native).toFixed(2)} : 1 상영` : ''}</span></div>
          <div class="maptools">
            <div class="chip-row">
              <button class="chip sm photochip" data-photoonly="1" aria-pressed="${state.photoOnly}">📷 실사 있는 좌석만</button>
              ${pc.seats || pc.links ? `<button class="chip sm" data-photogal="1">${pc.seats ? '실사 모아보기 ' + pc.shots + '컷' : '원문 링크 모아보기 ' + pc.links}</button>` : ''}
              <button class="chip sm cmpchip" data-cmpmode="1" aria-pressed="${state.cmpMode}">⚖️ 좌석 비교${(state.compare || []).length ? ' ' + state.compare.length : ''}</button>
            </div>
            <div class="chip-row">
              <button class="chip sm" data-mode="center" aria-pressed="${state.mode === 'center'}">화면 응시</button>
              <button class="chip sm" data-mode="level" aria-pressed="${state.mode === 'level'}">정면 고정</button>
            </div>
          </div>
          <div class="seatmap-scroll"><div class="seatmap" id="seatmap"></div></div>
          <div class="legend" id="legend"></div>
        </div>
      </div>

      <div class="panel">
        <div class="card" id="seatPanel"></div>
      </div>
    </div>

    ${galleryHtml(h)}

    <div class="sheet mobile-only" id="sheet">
      <div class="sheet-head" id="sheetHead"></div>
      <div id="sheetBody"></div>
    </div>
    <div class="scrim mobile-only" id="scrim"></div>`;
  }

  function legendHtml(h) {
    const c = h._types || {};
    const items = [];
    if (c.n) items.push(['일반석', 'background:#DCEDE4']);
    if (c.r) items.push([h.tags.includes('리클라이너') ? '리클라이너' : '릴렉스', 'background:#DCD8FB']);
    if (c.s) items.push(['SWEETBOX', 'background:#FBD5E8']);
    if (c.c) items.push(['카바나', 'background:#FDE7C3']);
    if (c.b) items.push(['빈백', 'background:#E7E4DD']);
    if (c.p) items.push(['장애인석', 'background:#BFE3FA']);
    items.push(['통로·빈칸', 'background:transparent;border:1px dashed #C9CFD6']);
    return items.map(([l, st]) => `<span><i style="${st}"></i>${l}</span>`).join('');
  }

  function galleryHtml(h) {
    const b = PHOTOS[h.id];
    if (!b || !b.seats) return '';
    const items = [];
    hSeatsRows(h).forEach((s) => {
      const arr = b.seats[s.key];
      if (!arr || !arr.length) return;
      const first = arr[0];
      const thumb = first.src
        ? `<img src="${esc(first.src)}" alt="${esc(h.name)} ${esc(s.key)} 좌석 시야" loading="lazy">`
        : `<div class="gal-noimg">🔗<span>원문 링크</span></div>`;
      items.push(`<button class="gal-item" data-seat="${esc(s.key)}" data-tabto="photo">
        ${thumb}
        <div class="gal-cap"><span>${esc(s.key)}</span><span class="t">${esc(tierLabel(first.tier))}${arr.length > 1 ? ' ' + arr.length + '컷' : ''}</span></div>
      </button>`);
    });
    if (!items.length) return '';
    return `<section class="gallery card card-pad" id="photoGallery">
      <div class="section-title" style="margin:0 0 12px"><h2>이 상영관 실사 좌석</h2><span class="cap">${items.length}석 · 누르면 그 좌석으로 이동</span></div>
      <div class="gal-grid">${items.join('')}</div>
    </section>`;
  }

  function hSeatsRows(h) {
    hallSeats(h);
    return h._seats;
  }

  /* ---------- 좌석판 ---------- */
  function paintSeatMap() {
    const h = findHall(state.theaterId, state.hallId);
    const box = $('#seatmap'); if (!h || !box) return;
    const p = h.params;
    const seats = hallSeats(h);
    const cols = h._cols;
    /* 통로 열(모든 행에서 빈 칸)은 좌석보다 넓은 고정 폭으로 그린다.
       CGV 앱처럼 세로 통로가 또렷하게 끊어져 보이고, 가로 통로(row.gapBefore)는 행 사이를 띄운다. */
    const aisleCol = [];
    for (let c = 0; c < cols; c++) aisleCol[c] = h.rows.every((r) => (r.c[c] || '.') === '.');
    /* 모든 좌석 칸은 고정 폭(var(--seat-w)) 하나 — 행마다 fr 분배가 달라져 칸 폭이
       달라지는 일이 없도록 트랙을 전부 같은 값으로 깝니다. 넓은 관(용산 IMAX 49열,
       영등포 SCREENX 38열)은 좌석판만 가로로 스크롤되고, 행 라벨은 왼쪽에 고정됩니다. */
    const tracks = [];
    for (let i = 0; i < cols; i++) tracks.push(aisleCol[i] ? 'var(--aisle-w)' : 'var(--seat-w)');
    const tpl = tracks.join(' ');
    box.innerHTML = h.rows.map((row) => {
      const lab = `<div class="rlab">${esc(row.l)}</div>`;
      let cells = '';
      for (let i = 0; i < cols; i++) {
        const cell = row.c[i] || '.';
        if (cell === '.') {
          /* 연속된 통로 칸은 한 칸으로 묶어 정확히 통로 폭만큼만 차지하게 */
          let k = 1;
          while (i + k < cols && aisleCol[i + k] && (row.c[i + k] || '.') === '.') k++;
          cells += `<div class="seat empty${aisleCol[i] ? ' aisle' : ''}" style="grid-column:span ${k}"></div>`;
          i += k - 1;
          continue;
        }
        const m = /^(\d+)([npsrcbx])$/.exec(cell); if (!m) { cells += '<div class="seat empty"></div>'; continue; }
        const key = row.l + m[1];
        const isSel = state.seatKey === key;
        const isCmp = (state.compare || []).indexOf(key) >= 0;
        const arr = photosFor(h.id, key);
        const has = arr.some(hasImg);                       /* 이미지 파일이 있는 좌석만 '실사' */
        const linkOnly = !has && arr.length > 0;
        const dim = state.photoOnly && !has;
        const tagTxt = has ? ' · 실사 사진 있음' : linkOnly ? ' · 원문 링크만' : '';
        cells += `<button class="seat ${isSel ? 'sel' : ''} ${isCmp ? 'cmp' : ''} ${has ? 'hascam' : ''} ${linkOnly ? 'haslink' : ''} ${dim ? 'dim' : ''}" data-seat="${key}" data-t="${m[2]}" title="${esc(key)} ${TYPES[m[2]] || ''}${tagTxt}">
          <span class="sn">${m[1]}</span>${has ? '<i class="cam"></i>' : ''}</button>`;
      }
      return `<div class="srow${row.gapBefore ? ' gap-before' : ''}">${lab}<div class="rcells" style="grid-template-columns:${tpl}">${cells}</div></div>`;
    }).join('');
    const lg = $('#legend');
    if (lg) lg.innerHTML = legendHtml(h);
    /* 넓은 관은 관에 처음 들어올 때 좌석판 가운데부터 보이게 (좌석 선택 같은 재렌더에서는 유지) */
    const sc = box.closest('.seatmap-scroll') || box.parentElement;
    if (sc && sc.clientWidth > 0) {
      const fresh = state._mapHall !== h.id;
      state._mapHall = h.id;
      if (fresh && sc.scrollWidth > sc.clientWidth + 2) {
        sc.scrollLeft = Math.round((sc.scrollWidth - sc.clientWidth) / 2);
      }
    }
    const g = $('#photoGallery');
    if (g && state.photoOnly) g.scrollIntoView({ block: 'nearest' });
  }

  /* ---------- 좌석 상세 ---------- */
  function emptySeatHtml(h) {

          <p>왼쪽 좌석 배치도에서 자리를 하나 골라보세요. 이 패널은 화면에 고정되어 있어요.</p>
        </div>
        <div class="pe-sum">
          <div class="pe-title">이 관 단차·출처 요약</div>

            <div>좌석 배치·좌석 수 <i class="cfb m">실측</i> CGV 예매 좌석표 DOM(2026-11-17 조회)</div>
            <div>스크린 제원 <i class="cfb ${p.conf === 'B' ? 'p' : 'e'}">${p.conf === 'B' ? '공개자료' : '추정'}</i> ${p.src ? `<a href="${esc(p.src)}" target="_blank" rel="noopener noreferrer">원문 ↗</a>` : '유형 추정'}</div>
            <div>상영관 등록정보 <i class="cfb p">공공데이터</i> 전국영화상영관표준데이터</div>
            ${pc.seats ? `<div>실사 사진 <i class="cfb m">직접 제보</i> 이 관 ${pc.seats}석</div>` : ''}
          </div>
        </div>
        ${withPhotos.length ? `<div class="pe-reco"><span>바로 볼 수 있는 자리</span><div class="reco">${withPhotos.slice(0, 8).map((s) => `<button data-seat="${esc(s.key)}">📷 ${esc(s.key)}</button>`).join('')}</div></div>` : ''}
      </div>`;
    }
    return `<div class="empty-state">
      <div class="empty-ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M4 17V9a2 2 0 012-2h2a2 2 0 012 2v1h4V9a2 2 0 012-2h2a2 2 0 012 2v8" stroke="#047857" stroke-width="1.7" stroke-linecap="round"/><path d="M2 19h20" stroke="#047857" stroke-width="1.7" stroke-linecap="round"/></svg></div>
      <h3>좌석을 하나 골라보세요</h3>
      <p>고른 자리에서 화면이 어떻게 보이는지<br>3D로 바로 보여드려요.</p>
      ${withPhotos.length ? `<div class="reco">${withPhotos.slice(0, 6).map((s) => `<button data-seat="${esc(s.key)}">📷 ${esc(s.key)}</button>`).join('')}</div>` : ''}
    </div>`;
  }

  /* 앉았을 때 어떤 느낌인지 — 숫자 대신 말로 */
  function feelLine(m) {
    const size = m.hFov >= 62 ? '스크린이 시야보다 넓어 고개를 조금씩 움직여야 하고'
      : m.hFov >= 46 ? '스크린이 한눈에 꽉 차고'
      : m.hFov >= 34 ? '스크린이 한눈에 들어오고'
      : m.hFov >= 24 ? '화면이 여유 있게 보이고'
      : '화면이 조금 멀게 느껴지고';
    const pos = Math.abs(m.yaw) < 4 ? '정면에 놓인 자리예요'
      : Math.abs(m.yaw) < 12 ? '가운데에서 조금 벗어난 자리예요'
      : '화면 가장자리 쪽 자리예요';
    let s = `${size} ${pos}`;
    if (m.neck > 15) s += ' 고개를 꽤 들어야 해요.';
    else if (m.neck < -6) s += ' 고개를 살짝 내려다보게 돼요.';
    return s;
  }

  function feelTag(m) {
    if (m.hFov >= 75) return ['화면이 아주 가까움', 'mid'];
    if (m.hFov >= 58) return ['시야를 가득 채우는 자리', 'good'];
    if (m.hFov < 26) return ['화면이 멀게 느껴짐', 'mid'];
    if (Math.abs(m.yaw) >= 14) return ['측면 자리', 'mid'];
    return ['보기 편한 자리', 'good'];
  }

  function sheetHeadHtml(h, seat) {
    if (!seat) return '';
    return `<div class="shgrab"></div>
      <div class="shrow">
        <div class="sh-t">
          <b>${esc(seat.key)}</b>
          <span>${esc(h ? h.name : '')}${h && seat ? ' · ' + (TYPES[seat.t] || '일반석') : ''}</span>
        </div>
        ${(() => { const a = photosFor(h ? h.id : '', seat.key); const im = imgCount(a), ln = linkCount(a);
          return (im ? `<span class="sh-cam">📷 ${im}</span>` : '') + (!im && ln ? `<span class="sh-cam link">🔗 링크 ${ln}</span>` : ''); })()}
        <button class="sheet-x" id="sheetClose" aria-label="닫기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#4E5968" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>`;
  }

  function panelHeadHtml(h, seat) {
    if (!seat) return '';
    return `<div class="seat-head">
      <div>
        <div class="seat-title">${esc(seat.key)}</div>
        <div class="seat-sub">${TYPES[seat.t] || '일반석'} · ${esc(h.name)}</div>
      </div>
    </div>`;
  }

  /* 3D 시야 탭 */
  function hallTypeLabel(h) {
    const t = (h.tags || []).join(' ');
    if (/IMAX/.test(t)) {
      const sys = h.params.system ? ' ' + h.params.system.replace(/^IMAX /, ' ') : '';
      return `IMAX${sys} · ${Number(h.params.native || h.params.aspect).toFixed(2)}:1 · ${fmt(h.params.screenW, 1)}×${fmt(h.params.screenH, 1)} m`;
    }
    if (/SCREENX/.test(t)) return 'SCREENX · 좌우 윙';
    if (/4DX/.test(t)) return '4DX';
    if (/리클라이너/.test(t) || /PRIVATE BOX/.test(t)) return '리클라이너';
    if (/씨네앤포레/.test(t)) return '씨네앤포레';
    if (/아트하우스/.test(t)) return '아트하우스';
    return '일반관';
  }

  /* 리클라이너 좌석이 있는 관 — 태그/이름에 리클라이너·RECLINER·TEMPUR, 또는 릴렉스시트(r) 좌석이 있는 관 */
  function isReclinerHall(h) {
    const t = ((h.tags || []).join(' ') + ' ' + (h.name || '')).toUpperCase();
    if (/리클라이너|RECLINER|TEMPUR/.test(t)) return true;
    return !!(h.seatTypes && (h.seatTypes.r || 0) > 0);
  }

  /* 용산아이파크몰 SCREENX관 = 정면+좌+우+천장 4면 스크린 */
  function isFourSide(h) {
    return state.theaterId === '0013' && /SCREENX/.test((h.tags || []).join(' '));
  }

  function simHtml(h, seat, m) {
    const tag = feelTag(m);
    return `<div class="v3d" data-v3d>
      <canvas class="v3d-canvas" width="640" height="480" aria-label="${esc(seat.key)} 좌석에서 본 상영관 3D 시야"></canvas>
      <div class="v3d-hud">
        <span class="v3d-type">${esc(hallTypeLabel(h))}</span>
        <span class="v3d-hudbtns">
          ${isReclinerHall(h) ? `<button class="v3d-recline" data-recline="1" aria-pressed="false" title="등받이 110°">🪑 젖히기 <b class="v3d-ang">110°</b></button>` : ''}
          <button class="v3d-vid" data-vid="1" aria-pressed="false" title="샘플 영상을 스크린에 재생">▶ 영상</button>
          <button class="v3d-mute" data-mute="1" aria-pressed="true" style="display:none" title="소리 켜기/끄기">🔇</button>
          <button class="v3d-reset" data-reset="1">정면 리셋</button>
        </span>
      </div>
      <div class="v3d-zoombar">
        <div class="v3d-zoom" role="group" aria-label="화각">
          <button data-zoom="1x" aria-pressed="true">사람 눈 1x</button>
          <button data-zoom="wide" aria-pressed="false">광각 0.5x</button>
        </div>
      </div>
      <div class="v3d-hint">드래그해서 둘러보기</div>
      <div class="v3d-zoomnote">사람 눈 1배율 · 실제로 보이는 크기</div>
    </div>
    <div class="feel">
      <span class="feel-tag ${tag[1]}">${esc(tag[0])}</span>
      <p>${esc(feelLine(m))}</p>
    </div>`;
  }

  /* 측정값/추정값 구분 배지 */
  function cfBadge(lv) {
    const map = { M: ['실측', 'm'], P: ['공개자료', 'p'], E: ['추정', 'e'], U: ['미확인', 'u'] };
    const v = map[lv] || map.U;
    return `<i class="cfb ${v[1]}">${v[0]}</i>`;
  }

  function provOf(h) {
    const p = h.params;
    return {
      seatmap: 'M',
      screen: p.conf === 'B' ? 'P' : 'E',
      geom: p.calib ? 'M' : 'P',
      photo: photosFor(h.id, 'Ø').length ? 'M' : 'U'
    };
  }

  /* 좌석 단차 표기 — 관 유형 기준표(공개 설계 기준)와 이 관 적용값(추정)을 나눠 쓴다.
     지점별 실측 도면이 없으므로 '실측'으로 올리지 않는다. 천안펜타포트 IMAX F11만 사진 계측. */
  function stepLine(p) {
    const f = (v, d) => fmt(v, d == null ? 2 : d);
    const type = p.stepType || '일반관';
    const std = p.stepStd != null ? p.stepStd : p.riser;
    const range = (p.stepMin != null && p.stepMax != null) ? `설계 기준 ${f(p.stepMin)}~${f(p.stepMax)} m` : '';
    const hall = p.riser;
    const differs = Math.abs(hall - std) >= 0.02;
    return `<div>좌석 간격 <em class="cfb e">추정</em> ${f(p.rowGap)} m · 유형 표준값</div>
        <div>좌석 단차 <em class="cfb p">공개자료</em> ${esc(type)} 기준 ${f(std)} m${range ? ' (' + range + ')' : ''}${differs ? ` · 이 관 ${f(hall)} m` : ''}</div>
        <div>이 관 적용값 <em class="cfb ${p.calib ? 'm' : (p.riserHall ? 'p' : 'e')}">${p.calib ? '실측' : (p.riserHall ? '공개자료' : '추정')}</em> ${p.calib ? esc(p.calib.evidence) + ' · 단차 ' + f(hall) + ' m' : (p.riserHall ? '지점별 공개 제원·후기로 보정한 값(' + f(hall) + ' m) — 같은 IMAX라도 용산은 완만, 천호는 가파르다는 후기처럼 지점마다 달라요' : '지점별 도면이 없어 유형 기준값을 그대로 적용 — 같은 유형이라도 지점마다 단차가 다를 수 있어요')}</div>
        <div>단차 근거 <em class="cfb p">근거</em> ${esc(p.stepBasis || '국내 극장 설계 기준의 앞뒤 슬로프 15~30 cm·시선 간격 120 mm 범위')}${p.stepSrc ? ` · <a href="${esc(p.stepSrc)}" target="_blank" rel="noopener noreferrer">출처 ↗</a>` : ''}
          <br><span style="color:var(--mute)">법정 기준(영화법 시행규칙 별표1)은 좌석 단차를 규정하지 않습니다.</span></div>`;
  }

  function fitLabel(m) {
    if (Math.abs(m.yaw) < 4 && m.hFov >= 30 && m.hFov <= 58 && m.neck < 18) return ['매우 좋음', 'good'];
    if (Math.abs(m.yaw) < 12 && m.hFov >= 24) return ['좋음', 'good'];
    if (Math.abs(m.yaw) >= 20 || m.hFov < 18) return ['아쉬움', 'mid'];
    return ['보통', 'mid'];
  }

  /* 시야 분석 — 값과 함께 무엇을 근거로 했는지 */
  function analysisHtml(h, seat, m) {
    const p = h.params, pr = provOf(h);
    const fit = fitLabel(m);
    const rows = [
      ['정면 시야 적합도', `<b class="fit ${fit[1]}">${fit[0]}</b>`, 'E'],
      ['좌우 시야각 (가로)', `<b>${fmt(m.hFov, 1)}°</b>`, 'E'],
      ['상하 시야각 (세로)', `<b>${fmt(m.vFov, 1)}°</b>`, 'E'],
      ['스크린까지 거리', `<b>${fmt(m.dist, 1)} m</b>`, 'E'],
      ['스크린 크기', `<b>${fmt(p.screenW, 1)} × ${fmt(p.screenH, 1)} m</b>`, pr.screen],
      ['화면비', `<b>${Number(p.native || p.aspect).toFixed(2)} : 1</b>${p.system ? ` <span class="sysmini">${esc(p.system)}</span>` : ''}`, pr.screen]
    ];
    return `<section class="ana">
      <div class="ana-head"><h4>시야 분석</h4><span>${esc(seat.key)} · ${esc(h.name)}</span></div>
      <div class="ana-rows">
        ${rows.map(([k, v, lv]) => `<div class="ana-row"><span>${k}</span>${v}${cfBadge(lv)}</div>`).join('')}
      </div>
      <div class="ana-foot">
        <span><i class="cfb m">실측</i> CGV 예매 좌석표·본인 촬영 계측</span>
        <span><i class="cfb p">공개자료</i> 배급사·상영관 공개 제원</span>
        <span><i class="cfb e">추정</i> 유형별 표준값(좌석 간격·단차)으로 계산</span>
      </div>
      <div class="ana-src">
        <b>데이터 출처</b>
        <div>좌석 배치·좌석 수 <em>${cfBadge(pr.seatmap)}</em> CGV 예매 좌석표 DOM · 2026-11-17 조회</div>
        <div>스크린 제원 <em>${cfBadge(pr.screen)}</em> ${p.conf === 'B' ? (h.tags.includes('IMAX') ? 'IMAX 공개 제원' : '극장 공개자료') : '좌석표·사진으로 유형 추정'}
          ${p.src ? `· <a href="${esc(p.src)}" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a>` : ''}</div>
        ${p.basis ? `<div>제원 보정 <em class="cfb e">근거</em> ${esc(p.basis)}</div>` : ''}
        ${stepLine(p)}
        <div>최근 갱신 <em class="cfb u">조회</em> ${esc(DATA.meta.surveyedAt || '2026-11-17')}</div>
      </div>
      ${(p.conf === 'B' || p.calib) ? '' : '<p class="ana-note">이 상영관은 실제 좌석에서 잰 값이 없어 스크린 거리·시야각은 유형 표준값으로 계산한 <b>추정치</b>예요. 실사 사진이 쌓이면 실측으로 바뀝니다.</p>'}
    </section>`;
  }

  function seatBodyHtml(seat) {
    const h = findHall(state.theaterId, state.hallId);
    const p = h.params, m = metrics(p, seat);
    const arr = photosFor(h.id, seat.key);
    const idx = clamp(state.photoIdx || 0, 0, Math.max(0, arr.length - 1));
    /* PC(≥960px)는 오른쪽 고정 패널에 3D·단면도·실사·한마디를 탭 없이 한 번에 보여준다 */
    if (isDesk()) {
      return `
        ${simHtml(h, seat, m)}
        <section class="dsec">
          <div class="dsec-head"><h4>단면도</h4><span>스크린·단차를 옆에서 본 그림</span></div>
          <div class="profile-card"><canvas class="profile-canvas" width="720" height="230"></canvas></div>
        </section>
        <section class="dsec">
          <div class="dsec-head"><h4>실사·블로그</h4><span>${imgCount(arr) ? imgCount(arr) + '장' : (linkCount(arr) ? '원문 링크 ' + linkCount(arr) : '없음')}</span></div>
          ${arr.length ? photoTabHtml(seat, arr, idx) : '<p class="sub dsec-empty">아직 이 자리 실사 사진이 없어요. 아래에서 티켓·사진을 올리면 이 자리에 바로 붙어요.</p>'}
        </section>
        ${analysisHtml(h, seat, m)}
        ${ugcHtml(h, seat)}`;
    }
    const tab = state.tab === 'photo' && !arr.length ? 'sim' : (state.tab || 'sim');
    return `
      <button class="back mini" data-go="hallback" style="margin:0 0 10px">‹ 좌석 선택으로</button>
      <div class="ptabs" role="tablist">
        <button data-ptab="sim" aria-pressed="${tab === 'sim'}">3D 시야</button>
        <button data-ptab="photo" aria-pressed="${tab === 'photo'}" ${arr.length ? '' : 'disabled'}>${imgCount(arr) ? '실사 사진 ' + imgCount(arr) : (linkCount(arr) ? '원문 링크 ' + linkCount(arr) : '실사 사진')}</button>
        <button data-ptab="profile" aria-pressed="${tab === 'profile'}">단면도</button>
      </div>
      <div class="tabbody">
        ${tab === 'sim' ? simHtml(h, seat, m) : ''}
        ${tab === 'photo' ? photoTabHtml(seat, arr, idx) : ''}
        ${tab === 'profile' ? `<div class="profile-card"><canvas class="profile-canvas" width="720" height="230"></canvas></div>
          <p class="sub" style="font-size:12.5px;margin-top:8px;line-height:1.55">스크린과 단차를 옆에서 본 그림이에요. 이 자리가 화면·단차와 어떤 높이 관계인지 보여요.</p>` : ''}
      </div>
      ${tab === 'sim' ? analysisHtml(h, seat, m) : ''}
      ${ugcHtml(h, seat)}`;
  }
  function photoTabHtml(seat, arr, idx) {
    if (!arr.length) {
      return `<div class="emptyphoto"><b>아직 실사 사진이 없어요</b>
        <p>${esc(seat.key)} 자리에서 찍은 실제 사진을 기다리고 있어요.<br>사진을 올려주시면 이 좌석에 바로 붙습니다.</p></div>`;
    }
    const cur = arr[idx];
    const media = cur.src
      ? `<div class="pv">
           <img src="${esc(cur.src)}" alt="${esc(seat.key)} 좌석에서 본 스크린" loading="lazy">
           <div class="pv-bar"><b>${esc(seat.key)} · 실제 시야</b><span>${esc(cur.fov || tierLabel(cur.tier))}</span></div>
         </div>`
      : `<div class="extphoto">
           <div class="extphoto-top"><b>${esc(seat.key)} · 원문에서 보기</b><span>${esc(cur.fov || tierLabel(cur.tier))}</span></div>
           <p>${esc(cur.note || '')}</p>
           ${cur.source ? `<a class="btn sm" style="width:100%;text-decoration:none" href="${esc(cur.source)}" target="_blank" rel="noopener noreferrer">원문 블로그에서 실사 보기 ↗</a>` : ''}
           <div class="extphoto-foot">사진은 저작권 보호를 위해 복제·재호스팅하지 않고 원문으로만 연결합니다. 시야 요약은 원문 표기 좌석과 글 내용을 바탕으로 정리했어요.</div>
         </div>`;
    return `
      ${media}
      ${arr.length > 1 ? `<div class="pv-switch">${arr.map((a, i) => `<button data-photo="${i}" aria-pressed="${i === idx}">${esc(a.fov || tierLabel(a.tier))}</button>`).join('')}</div>` : ''}
      <div class="pcred">
        <div class="row">
          <span class="badge ok">${cur.verify === 'photo' ? '사진 직접 확인' : '좌석 라벨로 확인'}</span>
          <span class="badge plain">${esc(tierLabel(cur.tier))}</span>
          ${cur.stereo ? `<span class="badge plain">${esc(cur.stereo)}</span>` : ''}
        </div>
        <dl>
          <dt>출처</dt><dd>${cur.source ? `<a href="${esc(cur.source)}" target="_blank" rel="noopener noreferrer">${esc(cur.credit || '원문 보기')} ↗</a>` : esc(cur.credit || '-')}</dd>
          <dt>촬영</dt><dd>${esc(cur.date || '-')}${cur.note ? ' · ' + esc(cur.note) : ''}</dd>
        </dl>
        ${cur.ticket ? `<div class="ticketmini"><img src="${esc(cur.ticket)}" alt="티켓 사진"><div style="font-size:12px;font-weight:700;color:var(--sub)">티켓으로 좌석 확인<br><span style="color:var(--mute);font-weight:600">${esc(cur.ticketNote || '발권 내역 캡처')}</span></div></div>` : ''}
      </div>`;
  }

  function paintSeatPanel() {
    const h = findHall(state.theaterId, state.hallId);
    if (!h) return;
    const seat = state.seatKey && h._byKey ? h._byKey[state.seatKey] : null;
    const body = seat ? seatBodyHtml(seat) : emptySeatHtml(h);
    const panel = $('#seatPanel');
    const sheetBody = $('#sheetBody');
    const sheetHead = $('#sheetHead');
    if (panel) panel.innerHTML = (seat ? panelHeadHtml(h, seat) : '') + body;
    if (sheetBody) sheetBody.innerHTML = body;
    if (sheetHead) sheetHead.innerHTML = seat ? sheetHeadHtml(h, seat) : '';
    if (seat) {
      const p = h.params, m = metrics(p, seat);
      const opts = { p: p, seat: seat, rows: h.rows, tags: h.tags || [], aspect: Number(state.aspect) || p.aspect, mode: state.mode, hallKey: h.id, fourSide: isFourSide(h) };
      [panel, sheetBody].filter(Boolean).forEach((root) => {
        const pc = root.querySelector('.profile-canvas');
        if (pc) drawProfile(pc, p, m, seat);
        if (root.querySelector('.v3d-canvas') && window.Viewer3D) {
          try { window.Viewer3D.mount(root, opts); } catch (err) {}
        }
      });
      bindUgc(h, seat);
    }
    bindSheetGestures();
  }

  /* ---------- 시트 제스처(배경 탭·아래로 스와이프 닫기) ---------- */
  function bindSheetGestures() {
    const sh = $('#sheet');
    if (!sh || sh._gest) return;
    sh._gest = true;
    let sy = 0, dy = 0, active = false;
    sh.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) { active = false; return; }
      /* 3D 뷰어·버튼·입력 위에서 시작한 터치는 시트 스와이프가 아니다.
         (예전에는 캔버스를 좌우로 드래그해 시야를 돌리는 순간 시트가 닫혀 버렸다) */
      const tgt = e.target;
      if (tgt && tgt.closest && tgt.closest('canvas, .v3d, .v3d-wrap, input, textarea, select, button, a, label')) {
        active = false; return;
      }
      active = sh.scrollTop <= 0;
      sy = e.touches[0].clientY; dy = 0;
    }, { passive: true });
    sh.addEventListener('touchmove', (e) => {
      if (!active) return;
      dy = e.touches[0].clientY - sy;
      if (dy > 0 && sh.scrollTop <= 0) sh.style.transform = 'translateY(' + Math.min(dy * 0.55, 140) + 'px)';
    }, { passive: true });
    sh.addEventListener('touchend', () => {
      if (!active) return;
      active = false;
      sh.style.transform = '';
      if (dy > 90) openSheet(false);
    });
  }

  function openSheet(open) {
    const s = $('#sheet'), sc = $('#scrim');
    if (!s) return;
    s.style.transform = '';
    s.classList.toggle('open', open);
    if (sc) sc.classList.toggle('open', open);
    document.body.style.overflow = open ? 'hidden' : '';
  }

  /* ---------- 좌석 비교 ---------- */
  function cmpHas(seatKey) { return (state.compare || []).indexOf(seatKey) >= 0; }

  function toggleCompare(seatKey) {
    const arr = state.compare || (state.compare = []);
    const i = arr.indexOf(seatKey);
    if (i >= 0) arr.splice(i, 1);
    else if (arr.length >= 4) { toast('비교는 최대 4석까지 담을 수 있어요'); return; }
    else arr.push(seatKey);
    paintSeatMap();
    paintCompareBar();

  /* 관·지점을 옮기면 비교 상태를 통째로 끈다(목록·비교 모드·떠 있는 비교 창까지) */

  /* ---------- UGC ---------- */
  function ugcKey() { return state.theaterId + '/' + state.hallId; }
  function ugcBucket() {
    const k = ugcKey();
    store[k] = store[k] || { seats: {}, list: [] };
    return store[k];
  }

  function ugcHtml(h, seat) {
    const bucket = store[ugcKey()] || { seats: {}, list: [] };
    const mine = (bucket.seats || {})[seat.key] || null;

    const tags = ['명당', '몰입 잘 됨', '앞사람 안 가림', '자막 잘 보임', '사운드 좋음'];

        ${shots.map((s) => `<figure><img src="${s}" alt="시야"><figcaption>시야</figcaption></figure>`).join('')}
      </div>

      <textarea class="review" id="reviewText" maxlength="200" rows="2" placeholder="한 줄이면 충분해요. 예) 자막 잘 보이고 앞사람 안 가려요">${mine ? esc(mine.text || '') : ''}</textarea>

      <div class="tagpick" id="tags">${tags.map((tg) => `<button data-tag="${tg}" aria-pressed="${mine && (mine.tags || []).includes(tg)}">${tg}</button>`).join('')}</div>

      <button class="btn" id="saveReview" style="width:100%;margin-top:16px">${mine ? '내 한마디 수정' : '한마디 남기기'}</button>

      <div class="review-list" id="reviewList">
        ${reviews.map((r) => `<div class="review">
          <div class="review-top"><span>${esc(r.author || '익명')}</span><span>${esc(r.date)}</span></div>
          ${r.movie ? `<span class="movie">🎬 ${esc(r.movie)}</span>` : ''}${r.ticket ? `<span class="ticketbadge">티켓 인증</span>` : ''}
          ${r.text ? `<p>${esc(r.text)}</p>` : ''}
          ${r.tags && r.tags.length ? `<div class="rts">${r.tags.map((x) => `<span>${esc(x)}</span>`).join('')}</div>` : ''}
          ${(r.shots && r.shots.length) || r.ticket ? `<div class="shots">${r.ticket ? `<img src="${r.ticket}" alt="티켓">` : ''}${(r.shots || []).map((s) => `<img src="${s}" alt="시야">`).join('')}</div>` : ''}
          <div style="margin-top:8px"><button class="helpful" data-helpful="${r.id}">👍 도움돼요 ${r.help || 0}</button></div>

  let draft = { rating: 0, tags: [], ticket: null, shots: [] };

  function compressImage(file, maxW, q) {
    return new Promise((resolve) => {
      const fr = new FileReader();
      fr.onload = () => {
        const im = new Image();
        im.onload = () => {
          const sc = Math.min(1, maxW / im.width);
          const c = document.createElement('canvas');
          c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
          c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
          try { resolve(c.toDataURL('image/jpeg', q)); } catch (e) { resolve(null); }
        };
        im.onerror = () => resolve(null);
        im.src = fr.result;
      };
      fr.onerror = () => resolve(null);
      fr.readAsDataURL(file);
    });
  }

  document.addEventListener('change', (e) => {
    const t = e.target;
    if (!t || !/^ticketOcr/.test("" + t.id)) return;
    const f = t.files && t.files[0];
    if (f) scanTicket(f);
  });

  function bindUgc(h, seat) {
    const bucket = ugcBucket();
    const mine = bucket.seats[seat.key] || null;
    draft = { tags: mine ? [...(mine.tags || [])] : [], ticket: mine ? mine.ticket || null : null, shots: mine ? [...(mine.shots || [])] : [] };
    const root = (document.getElementById('sheetBody') && window.innerWidth <= 900) ? document.getElementById('sheetBody') : document.getElementById('seatPanel');
    if (!root) return;

    root.querySelectorAll('#tags button').forEach((b) => {
      b.onclick = () => {
        const tg = b.dataset.tag; const i = draft.tags.indexOf(tg);
        if (i >= 0) draft.tags.splice(i, 1); else draft.tags.push(tg);
        b.setAttribute('aria-pressed', i < 0);

    });

    if (pendingTicket && pendingTicket.url) {
      const pt = pendingTicket; pendingTicket = null;
      draft.ticket = pt.url;
      const mv2 = root.querySelector('#movieInput');
      if (mv2 && !mv2.value) mv2.value = pt.movie || '';
      const th2 = root.querySelector('#thumbs');

      if (st2) st2.textContent = '첨부됨';
    }

    const tf = root.querySelector('#ticketFile');
    if (tf) tf.onchange = async () => {
      const f = tf.files && tf.files[0]; if (!f) return;
      const d = await compressImage(f, 420, 0.62);
      if (d) {
        draft.ticket = d; toast('티켓 사진을 첨부했어요');
        const th = root.querySelector('#thumbs'); if (th) th.insertAdjacentHTML('afterbegin', `<figure><img src="${d}" alt="티켓"><figcaption>티켓</figcaption></figure>`);
        const st = root.querySelector('#ticketState'); if (st) st.textContent = '첨부됨';
      }
    };
    const sf = root.querySelector('#shotFile');
    if (sf) sf.onchange = async () => {
      const f = sf.files && sf.files[0]; if (!f) return;
      const d = await compressImage(f, 560, 0.62);
      if (d) {
        draft.shots.push(d); toast('시야 사진을 첨부했어요');
        const th = root.querySelector('#thumbs'); if (th) th.insertAdjacentHTML('beforeend', `<figure><img src="${d}" alt="시야"><figcaption>시야</figcaption></figure>`);
        const st = root.querySelector('#shotState'); if (st) st.textContent = draft.shots.length + '장 첨부됨';
      }
    };

    const saveBtn = root.querySelector('#saveReview');
    if (saveBtn) saveBtn.onclick = () => {
      const text = (root.querySelector('#reviewText').value || '').trim().slice(0, 200);
      const mv = (root.querySelector('#movieInput').value || '').trim().slice(0, 40);
      if (!text && !draft.shots.length && !draft.ticket) { toast('사진이나 한마디 중 하나는 남겨주세요'); return; }
      const bucket2 = ugcBucket();
      const prev = bucket2.seats[seat.key];
      const id = prev && prev.id ? prev.id : 'r' + Date.now();
      const rec = { id, seat: seat.key, hall: h.name, author: nickname || '익명', text, tags: [...draft.tags], movie: mv, ticket: draft.ticket || null, shots: [...draft.shots], date: new Date().toISOString().slice(0, 10) };
      bucket2.seats[seat.key] = rec;
      bucket2.list = bucket2.list.filter((r) => !(r.seat === seat.key && r.id === id));
      bucket2.list.unshift({ ...rec, help: prev ? prev.help || 0 : 0 });
      bucket2.list = bucket2.list.slice(0, 60);
      save(); paintSeatPanel(); toast('남겼어요. 고마워요!');
    };
    root.querySelectorAll('[data-helpful]').forEach((b) => {
      b.onclick = () => {
        const bucket3 = ugcBucket();
        const r = bucket3.list.find((x) => x.id === b.dataset.helpful);
        if (!r) return; r.help = (r.help || 0) + 1; save(); b.textContent = '👍 도움돼요 ' + r.help;
      };
    });
  }


  /* ---------- 티켓 OCR — Gemini Flash 서버리스(api/ocr.js) ----------
     사진을 브라우저에서 가볍게 줄여 서버로 한 번 보내고, 읽은 결과는 이 기기에 캐시한다.
     서버가 아직 없거나(Vercel 미배포) 한도·네트워크가 막히면 느린 브라우저 OCR을 돌리지 않고
     곧바로 '사진만 붙이고 직접 고르기' 시트로 넘어간다. */
  const OCR_ENDPOINT = 'https://cgv-chungnam-seat-view.vercel.app/api/ocr';  /* Vercel 배포 URL로 바꾸면 된다 */
  const OCR_TIMEOUT_MS = 12000;
  const OCR_CACHE_KEY = 'cgv_ocr_cache_v1';
  const OCR_CACHE_MAX = 20;

  /* 사진 → 최대 변 1200px JPEG(품질 0.85). 통신량과 인식 시간을 함께 줄인다. */
  function ocrShrink(file) {
    return new Promise((resolve) => {
      const fr = new FileReader();
      fr.onload = () => {
        const im = new Image();
        im.onload = () => {
          const side = Math.max(im.width, im.height) || 1;
          const sc = Math.min(1, 1200 / side);
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(im.width * sc));
          c.height = Math.max(1, Math.round(im.height * sc));
          const x = c.getContext('2d');
          x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);   /* 투명 PNG도 흰 종이로 */
          x.drawImage(im, 0, 0, c.width, c.height);
          let url = '';
          try { url = c.toDataURL('image/jpeg', 0.85); } catch (e) { resolve(null); return; }
          const cut = url.indexOf(',');
          if (cut < 0) { resolve(null); return; }
          resolve({ dataUrl: url, base64: url.slice(cut + 1), mimeType: 'image/jpeg' });
        };
        im.onerror = () => resolve(null);
        im.src = fr.result;
      };
      fr.onerror = () => resolve(null);
      fr.readAsDataURL(file);
    });
  }

  function ocrFallbackHash(s) {
    let h1 = 0x811c9dc5, h2 = 0x01000193;
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 16777619) >>> 0;
      h2 = (h2 + Math.imul(c, i + 1)) >>> 0;
    }
    return 'f' + h1.toString(16) + h2.toString(16) + '-' + s.length.toString(16);
  }

  /* 사진 내용 해시 — 같은 사진을 다시 올리면 서버를 부르지 않는다 */
  function ocrHash(b64) {
    try {
      if (!(window.crypto && window.crypto.subtle && window.crypto.subtle.digest)) return Promise.resolve(ocrFallbackHash(b64));
      const buf = new TextEncoder().encode(b64);
      return window.crypto.subtle.digest('SHA-256', buf).then((d) => {
        const a = new Uint8Array(d);
        let s = '';
        for (let i = 0; i < a.length; i++) s += a[i].toString(16).padStart(2, '0');
        return s;
      }).catch(() => ocrFallbackHash(b64));
    } catch (e) { return Promise.resolve(ocrFallbackHash(b64)); }
  }

  function ocrCacheList() {
    try {
      const v = JSON.parse(localStorage.getItem(OCR_CACHE_KEY) || '[]');
      return Array.isArray(v) ? v : [];
    } catch (e) { return []; }
  }
  function ocrCacheGet(k) {
    if (!k) return null;
    const hit = ocrCacheList().find((it) => it && it.k === k && it.r);
    return hit ? hit.r : null;
  }
  function ocrCachePut(k, r) {
    if (!k || !r) return;
    try {
      const list = ocrCacheList().filter((it) => it && it.k !== k);
      list.unshift({ k: k, r: r, t: Date.now() });
      localStorage.setItem(OCR_CACHE_KEY, JSON.stringify(list.slice(0, OCR_CACHE_MAX)));
    } catch (e) { /* 저장 공간이 없으면 캐시만 포기한다 */ }
  }

  function ocrRequest(payload) {
    const ctl = typeof AbortController === 'function' ? new AbortController() : null;
    const timer = setTimeout(() => { if (ctl) ctl.abort(); }, OCR_TIMEOUT_MS);
    const opts = {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ imageBase64: payload.base64, mimeType: payload.mimeType })
    };
    if (ctl) opts.signal = ctl.signal;
    return fetch(OCR_ENDPOINT, opts).then((res) => res.json().catch(() => null).then((j) => {
      if (!res.ok || !j || j.ok !== true) {
        const err = new Error((j && j.error) || ('http_' + res.status));
        err.code = (j && j.error) || ('http_' + res.status);
        throw err;
      }
      return j;
    })).then(
      (j) => { clearTimeout(timer); return j; },
      (e) => { clearTimeout(timer); throw e; }
    );
  }

  function normKey(v) { return String(v || '').replace(/\s+/g, '').replace(/[·.,]/g, ''); }

  /* 서버가 돌려준 글자(theater·hall·seat·movie·date)를 기존 매칭 로직이 쓰는 모양으로 바꾼다 */
  function infoFromOcr(r) {
    const info = { branch: null, hall: null, rows: [], movie: '', date: '', time: '', raw: '' };
    if (!r) return info;

    const tRaw = String(r.theater || '').replace(/^CGV\s*/i, '').replace(/[\(（][^\)）]*[\)）]/g, ' ').replace(/\s+/g, ' ').trim();
    if (tRaw) {
      const k = normKey(tRaw);
      const cand = DATA.theaters.filter((th) => {
        const n = normKey(th.name);
        return n === k || (k.length >= 2 && n.indexOf(k) >= 0) || (n.length >= 3 && k.indexOf(n) >= 0);
      }).sort((a, b) => b.name.length - a.name.length);
      if (cand.length) info.branch = cand[0];
      else {
        /* 한 글자쯤 흘려 읽은 경우: 앞 3자가 같은 지점이 하나뿐이면 그것 */
        const p3 = DATA.theaters.filter((th) => normKey(th.name).slice(0, 3) === k.slice(0, 3));
        if (p3.length === 1) info.branch = p3[0];
      }
    }

    const hRaw = String(r.hall || '').trim();
    if (hRaw) {
      const hm = hRaw.match(/(\d{1,2})\s*관/);
      if (hm) info.hall = hm[1] + '관';
      else if (/imax|아이맥스/i.test(hRaw)) info.hall = 'IMAX';
      else if (/4dx/i.test(hRaw)) info.hall = '4DX';
      else if (/screen\s*x|스크린\s*x/i.test(hRaw)) info.hall = 'SCREENX';
      else if (/씨네앤포레/.test(hRaw)) info.hall = '씨네앤포레';
      else info.hall = hRaw.slice(0, 20);
    }

    const seatRaw = String(r.seat || '').toUpperCase().replace(/열/g, ' ').replace(/번/g, ' ');
    (seatRaw.match(/[A-Z]{1,2}\s*\d{1,3}/g) || []).forEach((tok) => {
      const m2 = tok.match(/([A-Z]{1,2})\s*(\d{1,3})/);
      if (!m2 || info.rows.length >= 4) return;
      const key = m2[1] + (+m2[2]);
      if (info.rows.some((x) => x.row + x.num === key)) return;
      info.rows.push({ row: m2[1], num: +m2[2] });
    });

    info.movie = String(r.movie || '').trim().slice(0, 60);

    const dRaw = String(r.date || '').trim();
    const dm = dRaw.match(/(20\d{2})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})/);
    if (dm) info.date = dm[1] + '-' + String(dm[2]).padStart(2, '0') + '-' + String(dm[3]).padStart(2, '0');
    const tm = dRaw.match(/(\d{1,2})\s*:\s*(\d{2})/);
    if (tm) info.time = String(tm[1]).padStart(2, '0') + ':' + tm[2];
    return info;
  }

  /* 인식 결과 → 좌석 후보 찾기 */
  function resolveTicket(info) {
    const res = { theater: info.branch || null, hall: null, seat: null, movie: info.movie || '', date: info.date || '', time: info.time || '' };
    if (!res.theater) return res;
    const halls = res.theater.halls || [];
    if (info.hall) {
      const k = normKey(info.hall);
      res.hall = halls.find((h) => normKey(h.name) === k) || halls.find((h) => normKey(h.name).indexOf(k) >= 0) || null;
    }
    if (!res.hall) {
      const withSeats = halls.filter((h) => h.status === 'ok');
      if (withSeats.length === 1) res.hall = withSeats[0];
    }
    if (res.hall && res.hall._byKey && info.rows.length) {
      /* OCR이 G→C, O→0, I→1 처럼 헷갈리게 읽는 경우를 보정 */
      const look = { C: 'G', G: 'C', O: 'D', D: 'O', Q: 'O', I: 'L', L: 'I', S: '5', Z: '2', B: '8', T: 'I' };
      for (const r of info.rows) {
        const tries = [r.row, look[r.row]].filter(Boolean);
        for (const rw of tries) {
          const key = rw + r.num;
          if (res.hall._byKey[key]) { res.seat = key; break; }
        }
        if (res.seat) break;
        /* 숫자만 맞고 행 글자를 못 믿을 때: 그 번호가 한 행에만 있으면 채택 */
        const rows = Object.keys(res.hall._byKey).filter((k) => k.replace(/^[A-Z]+/, '') === String(r.num));
        if (rows.length === 1) { res.seat = rows[0]; break; }
      }
    }
    return res;
  }

  let pendingTicket = null;

  function ocrOverlay(html) {
    let el = document.getElementById('tocModal');
    if (!el) {
      el = document.createElement('div');
      el.id = 'tocModal';
      el.className = 'tocmodal';
      document.body.appendChild(el);
    }
    el.innerHTML = html;
    /* 어떤 상태(진행·성공·실패)에서도 닫기가 항상 동작하도록 여기서 한 번에 연결한다 */
    el.querySelectorAll('#tocClose,[data-toc-close]').forEach((b) => {
      b.onclick = (ev) => { ev.preventDefault(); ev.stopPropagation(); closeOcr(); };
      b.oncontextmenu = null;
    });
    el.onclick = (ev) => { if (ev.target === el) closeOcr(); };
    return el;
  }
  function closeOcr() {
    ocrRun += 1;                       /* 진행 중인 인식 결과가 뒤늦게 창을 다시 열지 않게 */
    const el = document.getElementById('tocModal');
    if (el) el.remove();
    document.body.style.overflow = '';
  }

  /* 인식을 기다리는 동안 사용자가 창을 닫으면, 늦게 온 응답으로 시트가 다시 뜨지 않게 한다 */
  let ocrRun = 0;

  async function scanTicket(file) {
    const run = ++ocrRun;
    ocrOverlay(`<div class="toc-card">
      <div class="toc-spin"></div>
      <h3>티켓을 읽고 있어요</h3>
      <p>사진을 보내 글자를 읽는 중이에요. 보통 2~4초면 끝나요.</p>
      <button class="toc-x" id="tocClose" aria-label="닫기">✕</button>
    </div>`);
    document.body.style.overflow = 'hidden';

    const payload = await ocrShrink(file);
    if (run !== ocrRun) return;
    if (!payload) {
      ocrOverlay(`<div class="toc-card"><h3>사진을 열지 못했어요</h3><p>다른 사진으로 다시 시도해 주세요.</p><button class="btn" id="tocClose" style="width:100%;margin-top:12px">닫기</button></div>`);
      return;
    }

    let read = null;
    let failed = false;
    try {
      const key = await ocrHash(payload.base64);
      if (run !== ocrRun) return;
      read = ocrCacheGet(key);
      if (!read) {
        const j = await ocrRequest(payload);
        if (run !== ocrRun) return;
        read = { theater: j.theater || '', hall: j.hall || '', seat: j.seat || '', movie: j.movie || '', date: j.date || '' };
        ocrCachePut(key, read);
      }
    } catch (e) {
      failed = true;                   /* 미배포·한도 초과·네트워크 오류 — 느린 엔진 없이 바로 시트로 */
    }
    if (run !== ocrRun) return;
    showTicketSheet(file, read, failed);
  }

  /* 확인 시트 — 읽은 값이 있으면 채워 두고, 없으면(실패) 지금 보고 있는 자리로 채워 둔 채 직접 고르게 한다 */
  function showTicketSheet(file, read, failed) {
    const info = infoFromOcr(read);
    const res = resolveTicket(info);
    /* 사진에서 실제로 읽힌 항목 — 아래 기본값 채우기와 구분해 화면에 표시한다 */
    const readFrom = { theater: !!res.theater, hall: !!res.hall, seat: !!res.seat, movie: !!info.movie };
    /* 사진에서 지점을 못 읽었으면 지금 보고 있는 지점·관·좌석을 기본값으로 채워 둔다 */
    if (!res.theater && state.theaterId) {
      const t0 = findTheater(state.theaterId);
      if (t0) {
        res.theater = t0;
        const h0 = state.hallId ? findHall(state.theaterId, state.hallId) : null;
        if (h0) res.hall = h0;
        if (!res.seat && state.seatKey) res.seat = state.seatKey;
      }
    }
    const conf = (v) => (v ? 'on' : 'off');
    const ctxFilled = !readFrom.theater && !!(res.theater) && !failed;
    const confNote = failed
      ? '아래에서 지점·상영관·좌석만 골라 주세요. 사진은 그대로 붙습니다.'
      : (ctxFilled
        ? '사진에서 지점을 읽지 못해 <b>지금 보고 있는 자리</b>로 먼저 채워 뒀어요. 다르면 눌러서 고쳐주세요.'
        : '틀린 부분은 눌러서 고칠 수 있어요.');
    const theaterOpts = DATA.theaters.map((t) => `<option value="${t.id}" ${res.theater && res.theater.id === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('');
    const hallOpts = res.theater
      ? (res.theater.halls || []).map((h) => `<option value="${h.id}" ${res.hall && res.hall.id === h.id ? 'selected' : ''}>${esc(h.name)}${h.status === 'ok' ? '' : ' (좌석표 없음)'}</option>`).join('')
      : '';
    const seatText = info.rows.map((r) => r.row + r.num).join(', ');
    const title = failed ? '사진은 잘 올라갔어요!' : '티켓에서 이렇게 읽었어요';

    ocrOverlay(`<div class="toc-card">
      <button class="toc-x" id="tocClose" aria-label="닫기">✕</button>
      <h3>${title}</h3>
      <p class="toc-sub">${confNote}</p>
      <div class="toc-rows">
        <label class="toc-row ${conf(readFrom.theater)}"><span>지점</span>
          <select id="tocTheater"><option value="">지점 선택</option>${theaterOpts}</select></label>
        <label class="toc-row ${conf(readFrom.hall)}"><span>상영관</span>
          <select id="tocHall"><option value="">상영관 선택</option>${hallOpts}</select></label>
        <label class="toc-row ${conf(readFrom.seat)}"><span>좌석</span>
          <input id="tocSeat" value="${esc(res.seat || seatText)}" placeholder="예) D6"></label>
        <label class="toc-row ${conf(readFrom.movie)}"><span>영화</span>
          <input id="tocMovie" value="${esc(res.movie || '')}" placeholder="본 영화 (선택)"></label>
        <div class="toc-row meta"><span>일시</span><b>${esc([res.date, res.time].filter(Boolean).join(' ') || '읽지 못함')}</b></div>
      </div>
      <button class="btn" id="tocGo" style="width:100%;margin-top:12px">${res.seat || res.hall ? '이 자리 열고 사진 붙이기' : '고른 정보로 열고 사진 붙이기'}</button>
      <button class="btn ghost" id="tocOnly" style="width:100%;margin-top:8px;background:#F2F4F6;color:#4E5968">지금 자리에 사진만 붙이기</button>
      ${failed ? '<button class="btn ghost" id="tocRetry" style="width:100%;margin-top:8px;background:transparent;color:#0B7A4B">티켓 자동 읽기 다시 시도</button>' : ''}
      <button class="btn ghost" id="tocClose" style="width:100%;margin-top:8px;background:transparent;color:#8B95A1">닫기</button>
      <p class="toc-note">사진은 글자를 읽기 위해 서버로 한 번 전송되고 저장되지 않아요. 고른 정보와 사진은 이 기기에만 남습니다.</p>
    </div>`);

    const selT = document.getElementById('tocTheater');
    const selH = document.getElementById('tocHall');
    if (selT) selT.onchange = () => {
      const th = findTheater(selT.value);
      if (selH) selH.innerHTML = '<option value="">상영관 선택</option>' + (th ? (th.halls || []).map((h) => `<option value="${h.id}">${esc(h.name)}${h.status === 'ok' ? '' : ' (좌석표 없음)'}</option>`).join('') : '');
    };
    const retry = document.getElementById('tocRetry');
    if (retry) retry.onclick = () => scanTicket(file);
    const only = document.getElementById('tocOnly');
    if (only) only.onclick = async () => {
      const d = await compressImage(file, 560, 0.62);
      const movieV = (document.getElementById('tocMovie').value || '').trim();
      pendingTicket = { url: d, movie: movieV };
      closeOcr();
      paintSeatPanel();
      toast('지금 자리에 티켓 사진을 붙였어요');
    };
    const go = document.getElementById('tocGo');
    if (go) go.onclick = async () => {
      const tid = selT ? selT.value : '';
      const hid = selH ? selH.value : '';
      const rawSeat = (document.getElementById('tocSeat').value || '').toUpperCase();
      const movieV = (document.getElementById('tocMovie').value || '').trim();
      const d = await compressImage(file, 560, 0.62);
      pendingTicket = { url: d, movie: movieV };
      closeOcr();
      if (!tid) { paintSeatPanel(); toast('읽은 정보가 없어 지금 자리에 사진만 붙였어요'); return; }
      const hh0 = hid ? findHall(tid, hid) : null;
      let seatV = '';
      if (hh0 && hh0._byKey) {
        const toks = rawSeat.split(/[,\s/]+/).filter(Boolean);
        for (const tk of toks) {
          const clean = tk.replace(/[^A-Z0-9]/g, '');
          if (hh0._byKey[clean]) { seatV = clean; break; }
        }
      }
      if (!seatV) seatV = rawSeat.replace(/[^A-Z0-9]/g, '');
      state.theaterId = tid; state.hallId = hid || null; state.seatKey = seatV || null; state._mapHall = null; resetCompare();
      state.view = hid ? 'hall' : 'theater'; state.tab = 'sim'; state.aspect = null; state._sheetSeat = null;
      const hh = hid ? findHall(tid, hid) : null;
      if (hh) { state.aspect = String(hh.params.aspect); if (seatV && !(hh._byKey && hh._byKey[seatV])) state.seatKey = null; }
      syncHash(true);
      render();
      if (seatV && window.innerWidth <= 900) {
        const sh2 = $('#sheet');
        if (sh2) sh2.scrollTop = 0;
        openSheet(true);
      }
      toast(seatV ? seatV + ' 자리로 열었어요' : '지점·상영관을 열었어요');
    };
    document.querySelectorAll('#tocClose').forEach((b) => { b.onclick = closeOcr; });
  }

  function startTicketOcr() {
    const inp = document.getElementById('ticketOcr');
    if (inp) { inp.value = ''; inp.click(); return; }
    toast('티켓 사진 버튼을 찾지 못했어요');
  }

  function contribution() {
    let seats = 0, reviews = 0, photos = 0;
    Object.values(store).forEach((b) => {
      reviews += (b.list || []).length;
      seats += Object.keys(b.seats || {}).length;
      Object.values(b.seats || {}).forEach((s) => { photos += (s.shots || []).length + (s.ticket ? 1 : 0); });
    });
    return { seats, reviews, photos };
  }

  /* ---------- 캔버스: 1인칭 시야 ---------- */
  function drawView(canvas, p, m, hall, seat) {
    const W = canvas.width, H = canvas.height;
    const ctx = canvas.getContext('2d');
    const aspect = Number(state.aspect);
    const HSPAN = 118;
    const VSPAN = HSPAN * (H / W);
    const gx = state.mode === 'center' ? (m.aL + m.aR) / 2 : 0;
    const gv = state.mode === 'center' ? m.neck : 0;
    const X = (a) => W / 2 + ((a - gx) / HSPAN) * W;
    const Y = (a) => H / 2 - ((a - gv) / VSPAN) * H;

    ctx.clearRect(0, 0, W, H);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0A0F0D'); bg.addColorStop(0.5, '#0E1613'); bg.addColorStop(1, '#090D0B');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,255,255,.035)';
    ctx.fillRect(0, Y(m.vBot), W, H - Y(m.vBot));
    ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.beginPath();
    ctx.moveTo(0, Y(m.vBot)); ctx.lineTo(W, Y(m.vBot)); ctx.stroke();

    const sx0 = X(m.aL), sx1 = X(m.aR), sy0 = Y(m.vTop), sy1 = Y(m.vBot);
    ctx.fillStyle = '#141B18'; ctx.fillRect(sx0, sy0, sx1 - sx0, sy1 - sy0);
    ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(sx0, sy0, sx1 - sx0, sy1 - sy0);

    const scrAspect = p.screenW / p.screenH;
    let iw = p.screenW, ih = p.screenW / aspect;
    if (ih > p.screenH) { ih = p.screenH; iw = p.screenH * aspect; }
    const uL = -iw / 2, uR = iw / 2;
    const distAt = (u) => m.dC - p.curve * Math.pow((2 * u) / p.screenW, 2);
    const angH = (u) => Math.atan2(u - m.sx, distAt(u)) / D2R;
    const centerY = p.screenBottom + p.screenH / 2;
    const iTop = Math.atan2(centerY + ih / 2 - m.eyeY, m.dC) / D2R;
    const iBot = Math.atan2(centerY - ih / 2 - m.eyeY, m.dC) / D2R;
    const ix0 = X(angH(uL)), ix1 = X(angH(uR)), iy0 = Y(iTop), iy1 = Y(iBot);

    ctx.save();
    ctx.beginPath(); ctx.rect(ix0, iy0, ix1 - ix0, iy1 - iy0); ctx.clip();
    const iw2 = ix1 - ix0, ih2 = iy1 - iy0;
    const sky = ctx.createLinearGradient(0, iy0, 0, iy1);
    sky.addColorStop(0, '#10243A'); sky.addColorStop(.34, '#5B4B6B'); sky.addColorStop(.56, '#D9764C');
    sky.addColorStop(.74, '#F2B45E'); sky.addColorStop(.88, '#8C5A3C'); sky.addColorStop(1, '#241A1D');
    ctx.fillStyle = sky; ctx.fillRect(ix0, iy0, iw2, ih2);
    const sunR = Math.max(6, ih2 * .05);
    ctx.fillStyle = 'rgba(255,236,190,.92)';
    ctx.beginPath(); ctx.arc(ix0 + iw2 * .63, iy0 + ih2 * .56, sunR, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,210,150,.18)';
    ctx.beginPath(); ctx.arc(ix0 + iw2 * .63, iy0 + ih2 * .56, sunR * 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(22,17,22,.86)';
    ctx.beginPath();
    ctx.moveTo(ix0, iy1); ctx.lineTo(ix0 + iw2 * .16, iy0 + ih2 * .70); ctx.lineTo(ix0 + iw2 * .30, iy1);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(ix0 + iw2 * .52, iy1); ctx.lineTo(ix0 + iw2 * .78, iy0 + ih2 * .64); ctx.lineTo(ix1, iy1);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.94)';
    ctx.font = `600 ${Math.max(9, ih2 * .052)}px Pretendard, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('지금, 이 자리에서 보이는 화면', ix0 + iw2 / 2, iy1 - ih2 * .085);
    ctx.restore();

    for (let r = seat.y - 1; r >= Math.max(0, seat.y - 5); r--) {
      const headTop = p.eye + r * p.riser + p.headDelta;
      const angTop = Math.atan2(headTop - m.eyeY, (seat.y - r) * p.rowGap) / D2R;
      const yy = Y(Math.min(angTop, m.vTop + 4));
      if (yy < 0 || yy > H) continue;
      const alpha = Math.max(.28, .68 - (seat.y - r - 1) * .1);
      const rx = W * (0.055 + (seat.y - r) * 0.005), ry = H * 0.05;
      const hx = X(0) + ((r * 37) % 100 - 50) / 50 * W * 0.11;
      ctx.fillStyle = `rgba(4,6,5,${alpha})`;
      ctx.beginPath(); ctx.ellipse(hx, yy + ry, rx, ry, 0, Math.PI, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(hx, yy + ry * 2.2, rx * 1.7, ry, 0, Math.PI, Math.PI * 2); ctx.fill();
    }

    const seatBackY = H - H * 0.035;
    ctx.fillStyle = 'rgba(3,5,4,.92)';
    for (let i = -3; i <= 3; i++) {
      const bx = W / 2 + i * W * 0.16;
      ctx.beginPath();
      ctx.ellipse(bx, seatBackY + H * 0.06, W * 0.075, H * 0.075, 0, Math.PI, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = 'rgba(4,6,5,.72)';
    if (iy0 > sy0) ctx.fillRect(sx0, sy0, sx1 - sx0, iy0 - sy0);
    if (iy1 < sy1) ctx.fillRect(sx0, iy1, sx1 - sx0, sy1 - iy1);
    if (ix0 > sx0) ctx.fillRect(sx0, sy0, ix0 - sx0, sy1 - sy0);
    if (ix1 < sx1) ctx.fillRect(ix1, sy0, sx1 - ix1, sy1 - sy0);

    ctx.fillStyle = 'rgba(255,255,255,.42)'; ctx.font = '11px Pretendard, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(HSPAN + '° 보기  ·  화면 가로 ' + fmt(m.hFov, 1) + '°', 12, H - 12);
    ctx.textAlign = 'right';
    ctx.fillText(state.aspect + ':1', W - 12, H - 12);
  }

  /* ---------- 캔버스: 단면도 ---------- */
  function drawProfile(canvas, p, m, seat) {
    const W = canvas.width, H = canvas.height;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#FAFBFC'; ctx.fillRect(0, 0, W, H);

    const maxD = p.firstRow + (p.rows - 1) * p.rowGap + 2;
    const maxY = Math.max(p.screenBottom + p.screenH, p.eye + (p.rows - 1) * p.riser + 1.2) + 0.8;
    const padL = 34, padR = 20, padT = 18, padB = 26;
    const X = (mtr) => padL + (mtr / maxD) * (W - padL - padR);
    const Y = (h) => H - padB - (h / maxY) * (H - padT - padB);

    ctx.strokeStyle = '#DDE2E6'; ctx.lineWidth = 1;
    for (let i = 0; i < p.rows; i++) {
      const d0 = p.firstRow + i * p.rowGap - p.rowGap * 0.35;
      const d1 = p.firstRow + i * p.rowGap + p.rowGap * 0.35;
      const y = Y(i * p.riser);
      ctx.beginPath(); ctx.moveTo(X(d0), y); ctx.lineTo(X(d1), y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X(d1), y); ctx.lineTo(X(d1), Y((i + 1) * p.riser)); ctx.stroke();
    }

    ctx.fillStyle = '#047857';
    ctx.fillRect(X(0) - 4, Y(p.screenBottom + p.screenH), 4, Y(p.screenBottom) - Y(p.screenBottom + p.screenH));
    ctx.fillStyle = '#8B95A1'; ctx.font = '10px Pretendard, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('SCREEN', X(0) + 2, Y(p.screenBottom + p.screenH) - 6);

    const centerX = (p.minx + p.maxx) / 2;
    ctx.fillStyle = '#C7CDD3';
    for (let i = 0; i < p.rows; i++) {
      ctx.beginPath(); ctx.arc(X(p.firstRow + i * p.rowGap), Y(p.eye + i * p.riser), 2.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#00A862';
    ctx.beginPath(); ctx.arc(X(p.firstRow + seat.y * p.rowGap), Y(m.eyeY), 4.4, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = 'rgba(0,168,98,.75)'; ctx.lineWidth = 1.4; ctx.setLineDash([4, 3]);
    const seatD = X(p.firstRow + seat.y * p.rowGap), seatY = Y(m.eyeY);
    [[p.screenBottom + p.screenH], [p.screenBottom], [p.screenBottom + p.screenH / 2]].forEach(([yy]) => {
      ctx.beginPath(); ctx.moveTo(seatD, seatY); ctx.lineTo(X(0), Y(yy)); ctx.stroke();
    });
    ctx.setLineDash([]);

    ctx.fillStyle = '#6B7684'; ctx.font = '11px Pretendard, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(`고개 +${fmt(m.neck, 1)}°  ·  단차 ${fmt(m.steps, 1)}m  ·  거리 ${fmt(m.dist, 1)}m`, padL, 14);
  }

  /* ---------- MY ---------- */
  function viewMy() {
    const c = contribution();
    const keys = Object.keys(store).filter((k) => Object.keys((store[k] || {}).seats || {}).length);
    return `
    <div class="card card-pad">
      <div class="myhead">
        <button class="avatar" id="myAvatar" type="button" aria-label="프로필 사진 변경">${avatarHtml()}</button>
        <div style="flex:1;min-width:0">
          <div class="my-name" id="myName">${esc(nickname || '내 좌석 기록')}</div>
          <div class="my-sub" id="mySub">${nickname ? '내 좌석 기록 · 이 기기에만 저장돼요' : '닉네임을 정하면 여기에 표시돼요 · 이 기기에만 저장돼요'}</div>
          <div class="my-actions">
            <button class="chip sm" id="avatarChange" type="button">프로필 사진 변경</button>
            <button class="chip sm" id="avatarClear" type="button" style="${avatarImg ? '' : 'display:none'}">사진 지우기</button>
          </div>
        </div>
      </div>
      <input type="file" id="avatarFile" accept="image/*" hidden>
      <div class="metrics" style="margin-top:18px">
        <div class="metric"><span>남긴 좌석 후기</span><b class="num">${c.seats}</b></div>
        <div class="metric"><span>작성한 글</span><b class="num">${c.reviews}</b></div>
        <div class="metric"><span>올린 사진</span><b class="num">${c.photos}</b></div>
        <div class="metric"><span>티켓 인증</span><b class="num">${Object.values(store).reduce((a, b) => a + Object.values(b.seats || {}).filter((s) => s.ticket).length, 0)}</b></div>
      </div>
      <button class="chip sm" id="editNick" style="margin-top:14px">닉네임 ${nickname ? '변경' : '설정'}</button>
      <div class="sub" style="font-size:12.5px;margin-top:10px;line-height:1.6;font-weight:600">
        후기·사진은 이 기기 브라우저에만 저장됩니다. 포인트·현금 같은 유상 보상은 운영하지 않아요.
      </div>
    </div>
    <div class="section-title"><h2>내가 남긴 후기</h2><span class="cap">${c.seats}석</span></div>
    ${keys.length === 0 ? `<div class="card empty-state"><div class="empty-ic">💬</div><h3>아직 남긴 후기가 없어요</h3><p>좌석 화면에서 사진과 한마디를 남기면<br>여기에 차곡차곡 쌓여요.</p><button class="btn sm" style="margin-top:14px" data-go="home">지점 둘러보기</button></div>` :
        keys.map((k) => {
          const b = store[k]; const t = findTheater(k.split('/')[0]);
          const hid = k.split('/')[1];
          const hh = findHall(k.split('/')[0], hid);
          return Object.values(b.seats || {}).map((r) => `<div class="card card-pad reviewcard" style="margin-bottom:10px" data-go="hall" data-tid="${esc(k.split('/')[0])}" data-hid="${esc(hid)}" data-seat="${esc(r.seat)}" role="button" tabindex="0">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
              <div style="min-width:0"><b style="font-size:15px">${esc(t ? t.name : '')} ${esc(hh ? hh.name : r.hall)} ${esc(r.seat)}</b>
              <div class="seat-sub">${esc(r.date)} · ${'★'.repeat(r.rating)}</div></div>
              <span class="badge ok" style="flex:0 0 auto">보기</span>
            </div>
            ${r.movie ? `<div style="margin-top:8px"><span class="movie">🎬 ${esc(r.movie)}</span>${r.ticket ? '<span class="ticketbadge">티켓 인증</span>' : ''}</div>` : (r.ticket ? `<div style="margin-top:8px"><span class="ticketbadge">티켓 인증</span></div>` : '')}
            ${r.text ? `<p class="sub" style="font-size:13px;margin-top:8px;line-height:1.55">${esc(r.text)}</p>` : ''}
            ${(r.shots && r.shots.length) || r.ticket ? `<div class="shots">${r.ticket ? `<img src="${r.ticket}" alt="티켓">` : ''}${(r.shots || []).map((s) => `<img src="${s}" alt="시야">`).join('')}</div>` : ''}
            ${r.tags && r.tags.length ? `<div class="rts" style="display:flex;gap:5px;flex-wrap:wrap;margin-top:8px">${r.tags.map((x) => `<span class="badge ok">${esc(x)}</span>`).join('')}</div>` : ''}
          </div>`).join('');
        }).join('')}
    <div class="foot">기록은 브라우저 저장소(localStorage)에만 보관되며 외부로 전송되지 않습니다. 브라우저 데이터를 지우면 함께 사라져요.</div>`;
  }

  /* ---------- 이벤트 ---------- */
  /* 검색창: 입력 중에는 검색창을 건드리지 않고 '지점 카드 목록'만 갈아끼운다.
     (전체 render()를 돌리면 input DOM이 매 타건마다 재생성되어 iOS에서 화면이 튀고
      한글 조합이 'ㄷㅐㅈㅓㄴ'처럼 꺠진다.) 한글 조합 중에도 목록만 갱신해 그대로 이어진다. */
  let composing = false;
  document.addEventListener('compositionstart', (e) => {
    if (e.target && e.target.id === 'qInput') composing = true;
  }, true);
  document.addEventListener('compositionend', (e) => {
    if (e.target && e.target.id === 'qInput') {
      composing = false;
      state.q = e.target.value;
      updateTheaterGrid();
    }
  }, true);
  function updateTheaterGrid() {
    const box = document.getElementById('tgrid');
    if (!box) return;
    box.innerHTML = theaterCardsHtml(homeList());
  }
  document.addEventListener('change', async (e) => {
    if (!e.target || e.target.id !== 'avatarFile') return;
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const d = await compressImage(f, 240, 0.7);
    if (!d) { toast('사진을 읽지 못했어요'); return; }
    avatarImg = d;
    try { localStorage.setItem(AV_KEY, d); } catch (err) { toast('저장 공간이 부족해요'); }
    paintAvatar();
    toast('프로필 사진을 바꿨어요');
  });

  document.addEventListener('input', (e) => {
    if (!e.target || e.target.id !== 'qInput') return;
    state.q = e.target.value;
    if (composing) return;   /* 조합이 끝난 시점에 한 번만 목록 갱신 */
    updateTheaterGrid();
  });
  document.addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]');
    if (go) {
      const v = go.dataset.go;
      if (v === 'home') { state.view = 'home'; state.theaterId = null; state.hallId = null; state.seatKey = null; resetCompare(); }
      if (v === 'theater') { state.view = 'theater'; state.theaterId = go.dataset.id || state.theaterId; state.hallId = null; state.seatKey = null; resetCompare(); }
      if (v === 'hall') {
        state.view = 'hall'; state.theaterId = go.dataset.tid; state.hallId = go.dataset.hid; state._mapHall = null; resetCompare();
        state.seatKey = go.dataset.seat || null; state.aspect = null; state.photoIdx = 0; state.tab = 'sim';
        const hh = findHall(state.theaterId, state.hallId); if (hh) state.aspect = String(hh.params.aspect);
      }
      if (v === 'my') state.view = 'my';
      if (v === 'hallback') { state.seatKey = null; syncHash(true); render(); return; }
      syncHash(true);
      render(); return;
    }
    const f = e.target.closest('[data-filter]');
    if (f) { state.filter = f.dataset.filter; render(); return; }
    if (e.target.closest('[data-near]')) { toggleNear(); return; }
    const rg = e.target.closest('[data-region]');
    if (rg) { state.region = rg.dataset.region; render(); return; }
    const s = e.target.closest('[data-seat]');
    if (s && state.view === 'hall' && state.cmpMode && !s.dataset.tabto) {
      toggleCompare(s.dataset.seat); return;
    }
    if (s) {
      state.seatKey = s.dataset.seat; state.photoIdx = 0;
      state.tab = s.dataset.tabto || 'sim';
      syncHash(true);
      paintSeatMap(); paintSeatPanel();
      if (window.innerWidth <= 900 && !state.cmpMode) {
        const sh = $('#sheet');
        if (sh) sh.scrollTop = 0;
        openSheet(true);
      }
      return;
    }
    const tabb = e.target.closest('[data-ptab]');
    if (tabb) { state.tab = tabb.dataset.ptab; paintSeatPanel(); return; }
    const ph = e.target.closest('[data-photo]');
    if (ph) { state.photoIdx = +ph.dataset.photo; paintSeatPanel(); return; }
    const cm = e.target.closest('[data-cmpmode]');
    if (cm) {
      state.cmpMode = !state.cmpMode;
      toast(state.cmpMode ? '비교할 좌석을 눌러 담아보세요 (최대 4석)' : '비교 모드를 껐어요');
      render(); return;
    }
    if (e.target.closest('[data-cmpgo]')) { openCompare(); return; }
    if (e.target.closest('[data-cmpclear]')) { state.compare = []; paintSeatMap(); paintCompareBar(); return; }
    const po = e.target.closest('[data-photoonly]');
    if (po) { state.photoOnly = !state.photoOnly; render(); return; }
    const pg = e.target.closest('[data-photogal]');
    if (pg) { const g = $('#photoGallery'); if (g) g.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    const a = e.target.closest('[data-aspect]');
    if (a) { state.aspect = a.dataset.aspect; render(); return; }
    const md = e.target.closest('[data-mode]');
    if (md) {
      state.mode = md.dataset.mode;
      /* 모드 칩의 선택 표시 + 3D 카메라 시선(yaw/pitch)을 바로 전환 — 재렌더 없이 */
      document.querySelectorAll('[data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)));
      ['seatPanel', 'sheetBody'].forEach((id) => {
        const root = document.getElementById(id);
        const v = window.Viewer3D && window.Viewer3D.findFor ? window.Viewer3D.findFor(root) : null;
        if (v) v.setMode(state.mode);
      });
      return;
    }
    const soon = e.target.closest('[data-soon]');
    if (soon) { toast('이 상영관은 좌석표를 아직 확인하지 못했어요'); return; }
    if (e.target.closest('#editNick')) { nicknameModal(true); return; }
    if (e.target.closest('#myAvatar') || e.target.closest('#avatarChange')) {
      const fi = document.getElementById('avatarFile');
      if (fi) fi.click();
      return;
    }
    if (e.target.closest('#avatarClear')) {
      avatarImg = '';
      try { localStorage.removeItem(AV_KEY); } catch (e) {}
      paintAvatar();
      toast('프로필 사진을 지웠어요');
      return;
    }
    if (e.target.closest('#sheetClose') || e.target.id === 'scrim') { state._sheetSeat = null; openSheet(false); return; }
    const nav = e.target.closest('[data-tab]');
    if (nav) { state.view = nav.dataset.tab; render(); return; }
  });

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') openSheet(false); });

  /* 스크린 제원·화면비는 데이터(__DATA__)에 실려 온다 — build2.py + screens.json에서 보정 */
  hallSeats_init();
  function hallSeats_init() {
    DATA.theaters.forEach((t) => t.halls.forEach((h) => {
      if (h.status === 'ok' && h.rows) hallSeats(h);
    }));
  }
  applyHash();
  render();
  window.addEventListener('popstate', () => { applyHash(); render(); });
  window.__APP__ = { state, metrics, render, setNickname, setNear, clearNear, toggleNear, toChoseong, distKm, homeList, openCompare, toggleCompare };
  try {
    const askedLS = localStorage.getItem('cgv-chn-nick-asked');
    const askedCK = cookieGet(NK_ASKED);
    if (!nickname && !askedLS && !askedCK) {
      cookieSet(NK_ASKED, '1', 365);
      try { localStorage.setItem('cgv-chn-nick-asked', '1'); } catch (e) {}
      setTimeout(() => nicknameModal(false), 500);
    } else if (nickname) {
      /* 닉네임이 있으면 저장 위치를 서로 맞춰 둔다 */
      try { localStorage.setItem(NK_KEY, nickname); } catch (e) {}
      cookieSet(NK_COOKIE, nickname, 365);
    }
  } catch (e) {}
})();

</script>
</body>
</html>

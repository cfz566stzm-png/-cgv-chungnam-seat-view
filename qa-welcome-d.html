<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>영시미 인사 창 1280×800 QA</title>
<style>
  html,body{margin:0;padding:0;background:#C9CFD6;height:800px;overflow:hidden}
  iframe{width:1280px;height:800px;border:0;display:block;background:#F2F4F6}
  .tag{position:fixed;right:8px;top:8px;background:#111;color:#fff;font:600 11px -apple-system,sans-serif;padding:4px 8px;border-radius:6px;z-index:9}
</style>
</head>
<body>
<div class="tag" id="tag">1280×800</div>
<iframe id="f" title="view"></iframe>
<script>
  var q = new URLSearchParams(location.search);
  var f = document.getElementById('f');
  var qa = q.get('qa') || 'welcome';
  f.src = './qa-welcome.html?qa=' + qa + '&cb=' + Date.now();
  f.addEventListener('load', function () {
    setTimeout(function () { document.getElementById('tag').textContent = '1280×800 · ' + qa; }, 120);
  });
</script>
</body>
</html>

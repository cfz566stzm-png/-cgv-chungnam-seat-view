<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모바일 레이아웃 QA</title>
<style>
  html,body{margin:0;padding:0;background:#C9CFD6}
  body{height:700px;overflow:hidden}
  .stage{width:330px;height:700px;margin:0;padding:4px;transform-origin:top left}
  .phone{width:390px;height:844px;border:8px solid #111;border-radius:34px;overflow:hidden;background:#fff;
         transform:scale(0.81);transform-origin:top left}
  iframe{width:390px;height:844px;border:0;display:block}
  .tag{position:fixed;right:8px;top:8px;background:#111;color:#fff;font:600 11px -apple-system,sans-serif;padding:4px 8px;border-radius:6px;z-index:9}
</style>
</head>
<body>
<div class="tag" id="tag"></div>
<div class="stage"><div class="phone"><iframe id="f" title="view"></iframe></div></div>
<script>
  var v = new URLSearchParams(location.search).get('v') || 'hall';
  var map = {
    home: ['./index.html#/', '홈'],
    hall: ['./index.html#/t/cheonan-pentaport/h/cheonan-pentaport-n9', 'IMAX관 좌석판'],
    seat: ['./index.html#/t/cheonan-pentaport/h/cheonan-pentaport-n9/s/F11', 'F11 상세 · 실사 탭'],
    screenx: ['./index.html#/t/0013/h/0013-n16', '용산 SCREENX 4면'],
    sseat: ['./index.html#/t/0013/h/0013-n16/s/E13', '용산 SCREENX E13 · 바텀시트'],
    compare: ['./index.html#/t/0013/h/0013-n16/s/E13', '좌석 비교 모달'],
    yongsan: ['./index.html#/t/0013/h/0013-14', '용산 IMAX 624석'],
    seoul: ['./index.html#/t/0013', '용산아이파크몰 지점'],
    my:   ['./index.html#/my', '내 기록']
  };
  var pick = map[v] || map.hall;
  /* 전국 확장 QA용 — ?t=<지점id>&h=<관id>&s=<좌석> 으로 임의 화면을 390×844로 연다 */
  var q = new URLSearchParams(location.search);
  if (q.get('t')) {
    pick = ['#/t/' + q.get('t') + (q.get('h') ? '/h/' + q.get('h') : '') + (q.get('s') ? '/s/' + q.get('s') : ''),
            (q.get('t') + ' ' + (q.get('h') || '') + ' ' + (q.get('s') || '')).trim()];
  }
  var f = document.getElementById('f');
  f.src = pick[0].replace('./index.html', './index.html?cb=' + Date.now());
  if (v === 'compare') {
    f.addEventListener('load', function () {
      setTimeout(function () {
        try {
          var w = f.contentWindow;
          w.__APP__.state.compare = ['E13', 'E15'];
          w.__APP__.render();
          w.__APP__.openCompare();
        } catch (e) { document.getElementById('tag').textContent = '오류 ' + e.message; }
      }, 900);
    });
  }
  document.getElementById('tag').textContent = '390×844 · ' + pick[1];
</script>
</body>
</html>
